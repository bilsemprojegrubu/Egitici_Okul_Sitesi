(function(){
  if ("serviceWorker" in navigator) {
    var varDi = !!navigator.serviceWorker.controller, yenilendi = false;
    // Yeni sürüm devreye girince sayfa bir kez kendiliğinden yenilenir
    navigator.serviceWorker.addEventListener("controllerchange", function(){ if (varDi && !yenilendi) { yenilendi = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(r){ r.update(); }).catch(function(){});
  }
  var b = document.getElementById("yukleBtn"), ist = null;
  var kurulu = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (kurulu) return;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); ist = e; b.hidden = false; });
  window.addEventListener("appinstalled", function(){ b.hidden = true; });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) b.hidden = false;
  b.addEventListener("click", function(){
    if (ist) { ist.prompt(); ist.userChoice.then(function(){ ist = null; b.hidden = true; }); }
    else alert("Yüklemek için: Paylaş düğmesine bas, sonra \"Ana Ekrana Ekle\" seç.");
  });
})();
</script>
