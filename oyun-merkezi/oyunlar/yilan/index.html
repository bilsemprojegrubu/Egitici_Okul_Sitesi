<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yılan — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
</head>
<body data-oyun="yilan">
<header class="ust"><a class="geri" href="../../index.html">← Oyun Merkezi</a><h1>🐍 Yılan</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne">
  <canvas id="c" width="400" height="400" style="width:min(100%,400px)"></canvas>
  <p class="ipucu">Ok tuşları / WASD, ya da ekranda kaydır</p>
  <div class="kontrol">
    <button class="btn" data-y="0,-1" aria-label="Yukarı">▲</button>
    <button class="btn" data-y="-1,0" aria-label="Sola">◀</button>
    <button class="btn" data-y="0,1" aria-label="Aşağı">▼</button>
    <button class="btn" data-y="1,0" aria-label="Sağa">▶</button>
  </div>
  <div id="bitti" class="kaplama" hidden>
    <h2>Oyun bitti</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script>
// Yılan: puan = yenen elma sayısı
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d"), N = 20, H = 20;
  var yilan, yon, bekleyen, elma, puan, hayatta, zaman;
  function yeni() {
    yilan = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    yon = null; bekleyen = null; puan = 0; hayatta = true;
    document.getElementById("puan").textContent = 0;
    document.getElementById("bitti").hidden = true;
    elmaKoy(); ciz();
  }
  function elmaKoy() {
    do { elma = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (yilan.some(function (p) { return p.x === elma.x && p.y === elma.y; }));
  }
  function git(dx, dy) {
    if (!hayatta) return;
    var son = bekleyen || yon;
    if (son && son.x === -dx && son.y === -dy) return; // ters yöne dönülmez
    if (!yon) yon = { x: dx, y: dy }; else bekleyen = { x: dx, y: dy };
  }
  function adim() {
    if (!hayatta) return;
    if (yon) {
      if (bekleyen) { yon = bekleyen; bekleyen = null; }
      var b = { x: yilan[0].x + yon.x, y: yilan[0].y + yon.y };
      var yedi = b.x === elma.x && b.y === elma.y;
      var govde = yilan.slice(0, yedi ? yilan.length : yilan.length - 1);
      if (b.x < 0 || b.y < 0 || b.x >= N || b.y >= N || govde.some(function (p) { return p.x === b.x && p.y === b.y; })) {
        hayatta = false; ciz(); Skor.oyunBitti("yilan", puan); return;
      }
      yilan.unshift(b);
      if (yedi) { puan++; document.getElementById("puan").textContent = puan; if (yilan.length < N * N) elmaKoy(); }
      else yilan.pop();
    }
    ciz();
  }
  function ciz() {
    x.fillStyle = "#0b1220"; x.fillRect(0, 0, 400, 400);
    x.fillStyle = "#ef4444"; x.beginPath(); x.arc(elma.x * H + 10, elma.y * H + 10, 8, 0, 7); x.fill();
    yilan.forEach(function (p, i) { x.fillStyle = i ? "#22c55e" : "#86efac"; x.fillRect(p.x * H + 1, p.y * H + 1, H - 2, H - 2); });
    if (!yon && hayatta) { x.fillStyle = "#fff"; x.font = "18px sans-serif"; x.textAlign = "center"; x.fillText("Başlamak için yön seç", 200, 150); }
  }
  document.addEventListener("keydown", function (e) {
    var h = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key];
    if (h) { e.preventDefault(); git(h[0], h[1]); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-y]"), function (b) {
    b.addEventListener("click", function () { var v = b.getAttribute("data-y").split(","); git(+v[0], +v[1]); });
  });
  // Kaydırma ile yön
  var bx, by;
  C.addEventListener("pointerdown", function (e) { bx = e.clientX; by = e.clientY; });
  C.addEventListener("pointerup", function (e) {
    var dx = e.clientX - bx, dy = e.clientY - by;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) git(dx > 0 ? 1 : -1, 0); else git(0, dy > 0 ? 1 : -1);
  });
  document.getElementById("tekrar").addEventListener("click", yeni);
  setInterval(adim, 110);
  yeni();
})();
</script>
</body>
</html>
