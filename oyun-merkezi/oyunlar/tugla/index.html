<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuğla Kır — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
</head>
<body data-oyun="tugla">
<header class="ust"><a class="geri" href="../../index.html">&lt; Merkez</a><h1>TUĞLA KIR</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Can <b id="can">3</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne">
  <canvas id="c" class="cv" width="200" height="240" style="--mw:420px;touch-action:none"></canvas>
  <p class="ipucu">Sağa-sola kaydırarak (veya ◀ ▶ / A D tuşlarıyla) sopayı yönet. Topu düşürme, bütün tuğlaları kır! Her seviye biraz daha hızlı.</p>
  <div id="bitti" class="kaplama" hidden>
    <h2>Oyun bitti</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script src="../piksel.js"></script>
<script>
// Tuğla Kır: 200x240 düşük çözünürlük, ekranda büyütülür
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d"), W = 200, H = 240;
  var SUTUN = 10, SATIR = 6, BW = 18, BH = 8, OX = 10, OY = 28;
  var RENK = ["#ef4d5e", "#ef7d57", "#ffcd75", "#38b764", "#41a6f6", "#b55088"];
  var kd = RENK.map(function (r) { return r; });
  var pw, px, top, tg, puan, can, sev, bekle, calis, par, yazi, hedef;
  try { document.getElementById("rekor").textContent = Skor.rekor("tugla"); } catch (e) { }
  function seviye() {
    tg = [];
    for (var j = 0; j < SATIR; j++) for (var i = 0; i < SUTUN; i++) {
      var var_ = !(sev % 3 === 2 && (i + j) % 4 === 0);   // 3. seviyede delikli desen
      if (var_) tg.push({ x: OX + i * BW, y: OY + j * (BH + 1), j: j, can: (j < 1 && sev > 0) ? 2 : 1 });
    }
    bekle = true; hedef = null;
  }
  function topKoy() { top = { x: px, y: H - 22, vx: 0, vy: 0 }; bekle = true; }
  function yeni() {
    pw = 34; px = W / 2; puan = 0; can = 3; sev = 0; par = []; yazi = []; calis = true;
    seviye(); topKoy(); guncelleYazi();
    document.getElementById("bitti").hidden = true;
  }
  function guncelleYazi() { document.getElementById("puan").textContent = puan; document.getElementById("can").textContent = can; }
  function firlat() {
    if (!bekle) return;
    var s = 2.4 + sev * 0.25, a = (-90 + Px.rastgele(-25, 25)) * Math.PI / 180;
    top.vx = Math.cos(a) * s; top.vy = Math.sin(a) * s; bekle = false; Px.ses("tik");
  }
  function kir(b) {
    b.can--;
    if (b.can > 0) { Px.ses("tik"); return; }
    puan += (SATIR - b.j) * 10; Px.ses("puan"); guncelleYazi();
    for (var i = 0; i < 6; i++) par.push({ x: b.x + BW / 2, y: b.y + BH / 2, vx: Px.rastgele(-1.4, 1.4), vy: Px.rastgele(-1.6, 1), r: RENK[b.j], o: 24 });
    tg.splice(tg.indexOf(b), 1);
  }
  function guncelle() {
    if (!calis) return;
    var k = Px.k, h = 3.2;
    if (k.ArrowLeft || k.KeyA) { px -= h; hedef = null; }
    if (k.ArrowRight || k.KeyD) { px += h; hedef = null; }
    if (hedef !== null) px += Px.sinir(hedef - px, -4.5, 4.5);
    px = Px.sinir(px, pw / 2, W - pw / 2);
    if (Px.p.Space || Px.p.ArrowUp || Px.p.Enter) firlat();
    if (bekle) { top.x = px; top.y = H - 22; }
    else {
      var n = Math.ceil(Math.max(Math.abs(top.vx), Math.abs(top.vy)) / 2) + 1;
      for (var s = 0; s < n && !bekle; s++) {
        top.x += top.vx / n; top.y += top.vy / n;
        if (top.x < 3) { top.x = 3; top.vx = Math.abs(top.vx); }
        if (top.x > W - 3) { top.x = W - 3; top.vx = -Math.abs(top.vx); }
        if (top.y < 3) { top.y = 3; top.vy = Math.abs(top.vy); }
        // sopa
        if (top.vy > 0 && top.y >= H - 17 && top.y <= H - 11 && Math.abs(top.x - px) <= pw / 2 + 3) {
          var f = Px.sinir((top.x - px) / (pw / 2), -1, 1), sp = Math.min(Math.hypot(top.vx, top.vy) + 0.03, 5), a = (-90 + f * 62) * Math.PI / 180;
          top.vx = Math.cos(a) * sp; top.vy = Math.sin(a) * sp; top.y = H - 17; Px.ses("zipla");
        }
        // tuğlalar
        for (var i = 0; i < tg.length; i++) {
          var b = tg[i];
          if (top.x + 2 > b.x && top.x - 2 < b.x + BW - 1 && top.y + 2 > b.y && top.y - 2 < b.y + BH) {
            var dx = Math.min(top.x + 2 - b.x, b.x + BW - 1 - (top.x - 2)), dy = Math.min(top.y + 2 - b.y, b.y + BH - (top.y - 2));
            if (dx < dy) top.vx = -top.vx; else top.vy = -top.vy;
            kir(b); break;
          }
        }
        if (top.y > H + 4) {
          can--; guncelleYazi(); Px.ses("hata");
          if (can <= 0) { calis = false; Px.ses("kaybet"); Skor.oyunBitti("tugla", puan); return; }
          topKoy();
        }
      }
      if (!tg.length) { sev++; puan += 100; guncelleYazi(); yazi.push({ t: "SEVİYE " + (sev + 1), o: 70 }); Px.ses("kazan"); seviye(); topKoy(); }
    }
    par.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.o--; });
    par = par.filter(function (p) { return p.o > 0; });
    yazi.forEach(function (t) { t.o--; }); yazi = yazi.filter(function (t) { return t.o > 0; });
  }
  function ciz() {
    x.fillStyle = "#1a1c2c"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#262b44"; for (var i = 0; i < H; i += 8) x.fillRect(0, i, W, 1);
    tg.forEach(function (b) {
      x.fillStyle = "#0d0e1a"; x.fillRect(b.x, b.y, BW - 1, BH);
      x.fillStyle = b.can > 1 ? "#cbd5e1" : RENK[b.j]; x.fillRect(b.x + 1, b.y + 1, BW - 3, BH - 2);
      x.fillStyle = "rgba(255,255,255,.45)"; x.fillRect(b.x + 1, b.y + 1, BW - 3, 2);
    });
    // sopa
    x.fillStyle = "#0d0e1a"; x.fillRect(px - pw / 2 - 1, H - 15, pw + 2, 8);
    x.fillStyle = "#41a6f6"; x.fillRect(px - pw / 2, H - 14, pw, 6);
    x.fillStyle = "#73eff7"; x.fillRect(px - pw / 2, H - 14, pw, 2);
    x.fillStyle = "#ffcd75"; x.fillRect(px - pw / 2, H - 14, 3, 6); x.fillRect(px + pw / 2 - 3, H - 14, 3, 6);
    // top
    x.fillStyle = "#0d0e1a"; x.fillRect(Math.round(top.x) - 3, Math.round(top.y) - 3, 6, 6);
    x.fillStyle = "#f4f4f4"; x.fillRect(Math.round(top.x) - 2, Math.round(top.y) - 2, 4, 4);
    par.forEach(function (p) { x.fillStyle = p.r; x.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); });
    yazi.forEach(function (t) { Px.yazi(x, t.t, W / 2, 130, 12, "#ffcd75", "center"); });
    if (bekle && calis) Px.yazi(x, "DOKUN / BOŞLUK = FIRLAT", W / 2, 150, 8, "#f4f4f4", "center");
  }
  function konum(e) { var k = C.getBoundingClientRect(); return (e.clientX - k.left) * W / k.width; }
  C.addEventListener("pointerdown", function (e) { e.preventDefault(); hedef = konum(e); if (bekle) firlat(); });
  C.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "mouse") hedef = konum(e); });
  document.getElementById("tekrar").addEventListener("click", yeni);
  yeni(); Px.dongu(guncelle, ciz);
})();
</script>
</body>
</html>
