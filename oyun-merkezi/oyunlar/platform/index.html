<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
<style></style>
</head>
<body data-oyun="platform">
<header class="ust"><a class="geri" href="../../index.html">← Oyun Merkezi</a><h1>🏃 Platform</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne">
  <canvas id="c" width="480" height="300" style="width:min(100%,480px)"></canvas>
  <p class="ipucu">Boşluk / ↑ / dokun = zıpla (havada bir kez daha zıplayabilirsin). Jeton topla, boşluğa düşme!</p>
  <div id="bitti" class="kaplama" hidden>
    <h2>Oyun bitti</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script>
// Platform: kendiliğinden koşan karakter. puan = mesafe/20 + jeton*5
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d");
  var ph, jt, o, mesafe, hiz, coin, son, calis, solSinir;
  function yeni() {
    ph = [{ x: 0, w: 500, y: 220 }]; jt = []; o = { y: 220, v: 0, z: 0 }; mesafe = 0; hiz = 240; coin = 0;
    son = performance.now(); calis = true; uret();
    document.getElementById("bitti").hidden = true; document.getElementById("puan").textContent = 0;
    requestAnimationFrame(dongu);
  }
  function uret() { // ekranın sağında yeterince platform olsun
    var s = ph[ph.length - 1];
    while (s.x + s.w < mesafe + 1000) {
      var aralik = 60 + Math.random() * (50 + (hiz - 240) / 3);
      var w = 110 + Math.random() * 190, y = Math.max(150, Math.min(250, s.y + (Math.random() - 0.5) * 90));
      s = { x: s.x + s.w + aralik, w: w, y: y }; ph.push(s);
      if (Math.random() < 0.6) jt.push({ x: s.x + w / 2, y: y - 45, al: false });
    }
  }
  function zipla() {
    if (!calis || o.z >= 2) return;
    o.v = -540; o.z++;
  }
  function puan() { return Math.floor(mesafe / 20) + coin * 5; }
  function dongu(t) {
    if (!calis) return;
    var dt = Math.min(0.04, (t - son) / 1000); son = t;
    hiz = Math.min(420, hiz + 3 * dt);
    mesafe += hiz * dt;
    var px = mesafe + 80, eskiY = o.y;
    o.v += 1500 * dt; o.y += o.v * dt;
    if (o.v >= 0) { // aşağı inerken platforma konma
      for (var i = 0; i < ph.length; i++) {
        var p = ph[i];
        if (px + 10 > p.x && px - 10 < p.x + p.w && eskiY <= p.y + 1 && o.y >= p.y) { o.y = p.y; o.v = 0; o.z = 0; break; }
      }
    }
    jt.forEach(function (c) { if (!c.al && Math.abs(c.x - px) < 22 && Math.abs(c.y - (o.y - 20)) < 28) { c.al = true; coin++; } });
    ph = ph.filter(function (p) { return p.x + p.w > mesafe - 100; });
    jt = jt.filter(function (c) { return c.x > mesafe - 100; });
    uret();
    document.getElementById("puan").textContent = puan();
    ciz();
    if (o.y > 340) { calis = false; Skor.oyunBitti("platform", puan()); return; }
    requestAnimationFrame(dongu);
  }
  function ciz() {
    x.fillStyle = "#1e3a5f"; x.fillRect(0, 0, 480, 300);
    x.fillStyle = "#22c55e";
    ph.forEach(function (p) { x.fillRect(p.x - mesafe, p.y, p.w, 12); x.fillStyle = "#854d0e"; x.fillRect(p.x - mesafe, p.y + 12, p.w, 300); x.fillStyle = "#22c55e"; });
    x.font = "20px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    jt.forEach(function (c) { if (!c.al) x.fillText("🪙", c.x - mesafe, c.y); });
    x.font = "30px sans-serif"; x.fillText("🏃", 80, o.y - 16);
  }
  document.addEventListener("keydown", function (e) { if (e.code === "Space" || e.key === "ArrowUp") { e.preventDefault(); zipla(); } });
  C.addEventListener("pointerdown", zipla);
  document.getElementById("tekrar").addEventListener("click", yeni);
  yeni();
})();
</script>
</body>
</html>
