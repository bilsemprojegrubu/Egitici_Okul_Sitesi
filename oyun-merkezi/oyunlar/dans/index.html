<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaktüs Dansı — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
</head>
<body data-oyun="dans">
<header class="ust"><a class="geri" href="../../index.html">&lt; Merkez</a><h1>KAKTÜS DANSI</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne">
  <canvas id="c" class="cv" width="400" height="520" style="--mw:400px"></canvas>
  <p class="ipucu">Oklar düşünce tuşa bas: ← ↓ ↑ → ya da A S W D</p>
  <div class="kontrol" id="yonler">
    <button class="btn" data-k="0" aria-label="Sol">◀</button>
    <button class="btn" data-k="1" aria-label="Aşağı">▼</button>
    <button class="btn" data-k="2" aria-label="Yukarı">▲</button>
    <button class="btn" data-k="3" aria-label="Sağ">▶</button>
  </div>
  <div id="bitti" class="kaplama" hidden>
    <h2>Kaktüs yoruldu!</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script src="../piksel.js"></script>
<script>
// Dans Pisti: oklar yukarıdan düşer, hedef çizgisine gelince doğru tuşa bas. Puan = vuruş puanı x kombo.
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d"), W = 400, H = 520, LX = 72, LW = 64, RY = 462, SY = 196;
  var RENK = ["#ff4fd8", "#00e5ff", "#a7f070", "#ffe14d"], KOD = [["ArrowLeft", "KeyA"], ["ArrowDown", "KeyS"], ["ArrowUp", "KeyW"], ["ArrowRight", "KeyD"]];
  var notlar, sk, kombo, enKombo, can, kare, beat, bf, sonLn, bas, bitti, yazi, yazT, poz, hedef, bas0, par, flas, lvl, hitSay, bitisT;
  function yeni() {
    notlar = []; sk = 0; kombo = 0; enKombo = 0; can = 100; kare = 0; beat = 0; bf = 0; sonLn = -1; bas = false; bitti = false; yazi = ""; yazT = 0;
    poz = { a1: -.3, a2: .3, bob: 0, lean: 0 }; hedef = { a1: -.3, a2: .3, bob: 0, lean: 0 }; par = []; flas = [0, 0, 0, 0]; lvl = 0; hitSay = 0;
    document.getElementById("puan").textContent = 0; document.getElementById("bitti").hidden = true;
  }
  function bpm() { return Math.min(150, 100 + lvl * 5); }
  function hiz() { return Math.min(8, 4.2 + lvl * .35); }
  function ekle(l) { notlar.push({ l: l, y: SY, ok: false }); }
  function vurus() {
    var l = Px.tamsayi(0, 3); if (l === sonLn && Math.random() < .6) l = (l + Px.tamsayi(1, 3)) % 4; sonLn = l; ekle(l);
    if (Math.random() < Math.min(.4, lvl * .05)) { var m = (l + Px.tamsayi(1, 3)) % 4; ekle(m); }
  }
  function judge(t, renk) { yazi = t; yazT = 30;yaziRenk = renk; }
  var yaziRenk = "#fff";
  function poza(l) {
    if (l === 0) hedef = { a1: -2.1, a2: -.5, bob: 2, lean: -.18 };
    else if (l === 3) hedef = { a1: .5, a2: 2.1, bob: 2, lean: .18 };
    else if (l === 2) hedef = { a1: -2.8, a2: 2.8, bob: -4, lean: 0 };
    else hedef = { a1: -.6, a2: .6, bob: 9, lean: 0 };
  }
  function bas_(l) {
    if (!bas) { bas = true; return; }
    flas[l] = 8; poza(l); bas0 = kare;
    var en = null; notlar.forEach(function (n) { if (n.l === l && !n.ok && Math.abs(n.y - RY) <= 40 && (!en || Math.abs(n.y - RY) < Math.abs(en.y - RY))) en = n; });
    if (!en) return;
    var d = Math.abs(en.y - RY); en.ok = true; en.f = 12; hitSay++;
    var mk = d <= 15; kombo++; enKombo = Math.max(enKombo, kombo);
    sk += (mk ? 100 : 50) * Math.min(4, 1 + Math.floor(kombo / 10)); can = Math.min(100, can + (mk ? 2 : 1));
    judge(mk ? "MÜKEMMEL!" : "İYİ", mk ? "#ffcd75" : "#a7f070"); Px.ses(mk ? "puan" : "tik");
    for (var i = 0; i < (mk ? 10 : 5); i++) par.push({ x: LX + l * LW + LW / 2, y: RY, vx: Px.rastgele(-2, 2), vy: Px.rastgele(-3, 0), o: 24, c: RENK[l] });
    document.getElementById("puan").textContent = sk;
    if (hitSay % 16 === 0) { lvl++; judge("HIZLANDI!", "#73eff7"); }
  }
  function guncelle() {
    var i, l;
    for (l = 0; l < 4; l++) if (Px.p[KOD[l][0]] || Px.p[KOD[l][1]]) { if (!bitti) bas_(l); }
    if (!bas || bitti) { yaz0(); return; }
    kare++; bf++;
    if (bf >= 3600 / bpm()) { bf = 0; beat++; vurus(); }
    notlar.forEach(function (n) {
      n.y += hiz(); if (n.f) n.f--;
      if (!n.ok && n.y > RY + 40) { n.ok = true; n.miss = true; kombo = 0; can -= 10; judge("KAÇTI", "#ef4d5e"); Px.ses("hata"); hedef = { a1: -.2, a2: .2, bob: -2, lean: 0 }; }
    });
    notlar = notlar.filter(function (n) { return n.y < H + 20 && !(n.ok && !n.miss && !n.f); });
    if (can <= 0 && !bitti) {
      bitti = true; Px.ses("kaybet");
      bitisT = setTimeout(function () { Skor.oyunBitti("dans", sk); }, 700);
    }
    yaz0();
  }
  function yaz0() {
    for (var k in poz) poz[k] += (hedef[k] - poz[k]) * .25;
    if (kare - bas0 > 14 || !bas) hedef = { a1: -.3 + Math.sin(kare / 9) * .25, a2: .3 + Math.cos(kare / 9) * .25, bob: Math.sin(kare / 6) * 2, lean: Math.sin(kare / 18) * .06 };
    if (yazT > 0) yazT--; for (var i = 0; i < 4; i++) if (flas[i] > 0) flas[i]--;
    par.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += .15; p.o--; }); par = par.filter(function (p) { return p.o > 0; });
  }
  function ok(cx, cy, l, r, renk) { // piksel ok: l=0 sol,1 aşağı,2 yukarı,3 sağ
    x.save(); x.translate(cx, cy); x.rotate([-Math.PI / 2, Math.PI, 0, Math.PI / 2][l]);
    x.fillStyle = "#0d0e1a"; x.fillRect(-7, -2, 14, 18);
    for (var j = 0; j < r; j++) x.fillRect(-j - 3, -r + j - 3, 2 * j + 6, 4);
    x.fillStyle = renk; x.fillRect(-5, 0, 10, 14); for (var k = 0; k < r; k++) x.fillRect(-k - 1, -r + k - 1, 2 * k + 2, 2);
    x.fillStyle = "rgba(255,255,255,.5)"; x.fillRect(-4, 1, 3, 12);
    x.restore();
  }
  // ---- Spike benzeri piksel kaktüs (24x24 gövde, kol, bot) kodla çizilir ----
  var SP = (function () {
    var N = 24, g = []; for (var r = 0; r < N; r++) { g.push([]); for (var c = 0; c < N; c++) g[r].push("."); }
    function put(c, r, ch) { if (r >= 0 && r < N && c >= 0 && c < N) g[r][c] = ch; }
    var L = { 5: [5, 18], 6: [3, 20], 21: [3, 20], 22: [5, 18] }, r, c;
    for (r = 5; r <= 22; r++) { var a = L[r] || [2, 21]; for (c = a[0]; c <= a[1]; c++) put(c, r, "g"); }
    for (r = 6; r <= 21; r++) { for (c = 3; c <= 5; c++) if (g[r][c] === "g") g[r][c] = "G"; for (c = 17; c <= 20; c++) if (g[r][c] === "g") g[r][c] = "d"; }
    for (r = 8; r <= 21; r++) { put(9, r, "d"); put(14, r, "d"); }
    [[3, 9], [20, 8], [3, 15], [20, 14], [8, 6], [16, 6], [11, 20], [5, 20], [18, 19]].forEach(function (t) { put(t[0], t[1], "w"); });
    // gözler
    for (r = 9; r <= 14; r++) for (c = 5; c <= 10; c++) { put(c, r, "e"); put(c + 8, r, "e"); }
    for (r = 11; r <= 14; r++) for (c = 8; c <= 9; c++) { put(c, r, "k"); put(c + 6, r, "k"); }
    for (c = 5; c <= 10; c++) { put(c, 8, "k"); put(c + 8, 8, "k"); }
    // gülen ağız
    for (c = 8; c <= 15; c++) { put(c, 16, "k"); put(c, 19, "k"); } for (r = 17; r <= 18; r++) { put(7, r, "k"); put(16, r, "k"); for (c = 8; c <= 15; c++) put(c, r, r === 17 ? "t" : "m"); }
    // çiçek (sol üst)
    [[4, 0], [5, 0], [3, 1], [4, 1], [5, 1], [6, 1], [2, 2], [3, 2], [6, 2], [7, 2], [3, 3], [4, 3], [5, 3], [6, 3], [4, 4], [5, 4]].forEach(function (t) { put(t[0], t[1], "p"); });
    put(4, 2, "y"); put(5, 2, "y"); put(4, 3, "y"); put(5, 3, "y"); put(3, 1, "P"); put(4, 0, "P"); put(2, 2, "P");
    put(5, 5, "g"); put(6, 5, "g");
    var cp = g.map(function (row) { return row.slice(); });
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (g[r][c] === ".") { var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (d) { var rr = r + d[1], cc = c + d[0]; return rr >= 0 && rr < N && cc >= 0 && cc < N && g[rr][cc] !== "." && g[rr][cc] !== "k"; }); if (nb) cp[r][c] = "k"; }
    var pal = { k: "#0d0e1a", g: "#38b764", G: "#a7f070", d: "#257179", w: "#fff8d0", e: "#ffffff", p: "#ff4fd8", P: "#ff9aee", y: "#ffe14d", t: "#ffffff", m: "#8a1f3a", o: "#a05a2c", O: "#6f3a1c" };
    var kol = ["kkkkkkk", "kGggggk", "kGgggdk", "kGgggdk", "kGgggdk", "kGgggdk", "kGgggdk", "kGgggdk", "kGwgdwk", "kGggggk", "kkgggkk", ".kkkkk."];
    var bot = [".kkkkkkkkk.", "kooooooooOk", "kooooooOOOk", "kkkkkkkkkkk"];
    return { b: Px.sprite(cp.map(function (r) { return r.join(""); }), pal, 3), a: Px.sprite(kol, pal, 3), f: Px.sprite(bot, pal, 3) };
  })();
  function dansci() {
    var cx = 200, cy = 112 + poz.bob * 1.2, sp = Math.round(Math.sin(kare / 5) * 4);
    x.save(); x.imageSmoothingEnabled = false; x.translate(cx, cy); x.rotate(poz.lean);
    x.drawImage(SP.f, -34 + sp, 34); x.drawImage(SP.f, 1 - sp, 34);
    function kol(sx, a) { x.save(); x.translate(sx, -4); x.rotate(a); x.drawImage(SP.a, -10, -3); x.restore(); }
    kol(-37, poz.a1); kol(37, poz.a2);
    x.drawImage(SP.b, -36, -42 + (Math.floor(kare / 8) % 2));
    x.restore();
  }
  function ciz() {
    var i, l;
    // sahne zemini
    var bt = bf / (3600 / bpm()), pals = ["#ff4fd8", "#ffe14d", "#ffffff", "#a7f070"];
    x.fillStyle = "#0d0e1a"; x.fillRect(0, 0, W, H);
    var gk = ["#3a1f5d", "#7a2f6a", "#c24a5a", "#ef7d57", "#ffcd75"];
    for (i = 0; i < 5; i++) { x.fillStyle = gk[i]; x.fillRect(0, i * 28, W, 28); }
    x.fillStyle = "#fff4b0"; x.fillRect(300, 70 + bt * 2, 36, 36); x.fillStyle = "#ffe14d"; x.fillRect(304, 74 + bt * 2, 28, 28);
    x.fillStyle = "#5d275d"; x.fillRect(20, 96, 90, 44); x.fillRect(34, 80, 40, 16); x.fillRect(250, 110, 120, 30); x.fillRect(280, 92, 50, 18);
    x.fillStyle = "#e0a060"; x.fillRect(0, 140, W, 56); x.fillStyle = "#c78848"; for (i = 0; i < 8; i++) x.fillRect((i * 61 + beat * 0) % W, 150 + (i % 3) * 14, 26, 3);
    x.fillStyle = "#257179"; x.fillRect(46, 112, 8, 30); x.fillRect(40, 120, 6, 4); x.fillRect(54, 124, 6, 4); x.fillRect(340, 118, 8, 24); x.fillRect(334, 126, 6, 4);
    x.fillStyle = pals[beat % 4]; x.globalAlpha = .2 - bt * .12; x.fillRect(0, 140, W, 56); x.globalAlpha = 1;
    dansci();
    // şeritler
    x.fillStyle = "#12142a"; x.fillRect(LX - 4, SY - 6, LW * 4 + 8, H - SY + 6);
    for (l = 0; l < 4; l++) { x.fillStyle = l % 2 ? "#181c38" : "#1d2144"; x.fillRect(LX + l * LW, SY, LW, H - SY); x.fillStyle = flas[l] ? RENK[l] : "#262b44"; x.globalAlpha = flas[l] ? .35 : 1; x.fillRect(LX + l * LW, SY, LW, H - SY); x.globalAlpha = 1; }
    for (l = 0; l < 4; l++) { x.globalAlpha = .45 + (flas[l] ? .55 : 0); ok(LX + l * LW + LW / 2, RY - 4, l, 12, flas[l] ? "#fff" : "#566c86"); x.globalAlpha = 1; }
    notlar.forEach(function (n) { if (n.miss) { x.globalAlpha = .3; } if (n.ok && !n.miss) { x.globalAlpha = n.f / 12; ok(LX + n.l * LW + LW / 2, n.y - 4 - (12 - n.f) * 2, n.l, 12 + (12 - n.f), "#fff"); } else ok(LX + n.l * LW + LW / 2, n.y - 4, n.l, 12, RENK[n.l]); x.globalAlpha = 1; });
    par.forEach(function (p) { x.fillStyle = p.c; x.globalAlpha = p.o / 24; x.fillRect(p.x, p.y, 4, 4); x.globalAlpha = 1; });
    // üst bilgi
    x.fillStyle = "#0d0e1a"; x.fillRect(8, 8, 104, 12); x.fillStyle = can > 35 ? "#38b764" : "#ef4d5e"; x.fillRect(10, 10, Math.max(0, can), 8);
    Px.yazi(x, "KOMBO " + kombo + (kombo >= 10 ? "  x" + Math.min(4, 1 + Math.floor(kombo / 10)) : ""), 392, 8, 12, "#ffcd75", "right");
    if (yazT > 0) Px.yazi(x, yazi, 200, SY - 30 - (30 - yazT) / 3, 22, yaziRenk, "center");
    if (!bas) { x.fillStyle = "rgba(13,14,26,.75)"; x.fillRect(40, 270, 320, 90); Px.yazi(x, "Bir ok tuşuna bas!", 200, 288, 22, "#ffcd75", "center"); Px.yazi(x, "Oklar çizgiye gelince aynı tuşa bas", 200, 322, 12, "#fff", "center"); }
  }
  document.addEventListener("keydown", function (e) { if (/^(Arrow|Key[ASWD]|Space)/.test(e.code)) { if (e.code.indexOf("Arrow") === 0 || e.code === "Space") e.preventDefault(); } });
  [].forEach.call(document.querySelectorAll("[data-k]"), function (b) {
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); Px.p[KOD[+b.getAttribute("data-k")][0]] = true; });
  });
  C.addEventListener("pointerdown", function (e) { var r = C.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, l = Math.floor((px - LX) / LW); if (!bas) Px.p.ArrowLeft = true; else if (l >= 0 && l < 4) Px.p[KOD[l][0]] = true; });
  document.getElementById("tekrar").addEventListener("click", function () { clearTimeout(bitisT); yeni(); });
  yeni(); Px.dongu(guncelle, ciz);
})();
</script>
</body>
</html>
