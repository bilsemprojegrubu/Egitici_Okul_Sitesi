<script>
// Futbol: tepeden görünümlü 2'ye 2 + kaleci piksel maç. 1 oyuncu (bota karşı, sıralamaya yazılır: puan = gol*10 + galibiyet 20), 2 oyuncu (sıralamasız)
(function () {

  var PL = 14, PR = 226, PT = 20, PB = 152, GT = 69, GB = 103, CY = 86, CX = 120, SURE = 90 * 60;
  var say = 0, gw = 0, sayNo = 0;
  var mod = 1, zor = 1, elle = false, pl, top, skor, sure, altin, calis, tik, parc, mesaj, msayac, sars, kontrolId, bitis, ses2;
  var insanlar; // [{takim, ctrl(oyuncu), tus, onceSut, sarj}]
  function kit(ana, koyu, saç) {
    var P = { k: "#0d0e1a", s: "#ffcd75", h: saç, j: ana, J: koyu, w: "#fff", p: "#1a1c2c", g: "#94a0b8" };
    var g = ["..kkk..", ".khhhk.", ".ksssk.", "..sss..", ".jjjjj.", "sjjwjjs", "sjjjjjs", ".jJJJj.", ".ppppp."];
    var b = [["..p.p..", "..s.s..", ".kk.kk."], [".pp.p..", ".s..ss.", ".kk..kk"], ["..p.pp.", ".ss.s..", "kk..kk."]];
    return b.map(function (l) { return Px.sprite(g.concat(l), P, 1); });
  }
  var KIT = [kit("#e0344f", "#b13e53", "#5d275d"), kit("#41a6f6", "#3b5dc9", "#ef7d57")];
  var KALECI = [kit("#a7f070", "#38b764", "#1a1c2c"), kit("#ffcd75", "#ef7d57", "#1a1c2c")];
  function oyuncu(t, rol, px, py) { return { t: t, rol: rol, x: px, y: py, bx: px, by: py, vx: 0, vy: 0, yx: t === 0 ? 1 : -1, yy: 0, f: 0, cd: 0 }; }
  function dizil() {
    pl = [oyuncu(0, "k", PL + 7, CY), oyuncu(0, "f", 70, 62), oyuncu(0, "f", 70, 110), oyuncu(1, "k", PR - 7, CY), oyuncu(1, "f", 170, 62), oyuncu(1, "f", 170, 110)];
    top = { x: CX, y: CY, vx: 0, vy: 0, d: 0, gol: 0, son: -1 };
  }
  function yeni() {
    skor = [0, 0]; sure = SURE; altin = false; calis = true; tik = 0; parc = []; msayac = 0; sars = 0; bitis = false;
    dizil();
    insanlar = [{ t: 0, c: pl[1], onceSut: false, sarj: 0 }];
    if (mod === 2) insanlar.push({ t: 1, c: pl[4], onceSut: false, sarj: 0 });
    document.getElementById("bitti").hidden = true; yazBaslik();

  }
  function yazBaslik() { document.getElementById("puan").textContent = skor[0] * 10; }
  function kickoff(t, m) {
    dizil2(); top.x = CX; top.y = CY; top.vx = top.vy = 0; top.gol = 0; mesaj = ""; msayac = 0; gw = 0; say = 150; sayNo = 0;
  }
  function dizil2() {
    var yer = [[PL + 7, CY], [75, 62], [75, 110], [PR - 7, CY], [165, 62], [165, 110]];
    pl.forEach(function (p, i) { p.x = yer[i][0]; p.y = yer[i][1]; p.vx = p.vy = 0; p.cd = 0; });
  }
  var KEY = {
    0: { u: ["KeyW"], d: ["KeyS"], l: ["KeyA"], r: ["KeyD"], sut: ["KeyF"], pas: ["KeyG"], ku: ["KeyQ"], kd: ["KeyE"] },
    1: { u: ["ArrowUp"], d: ["ArrowDown"], l: ["ArrowLeft"], r: ["ArrowRight"], sut: ["Enter"], pas: ["ShiftRight", "Slash"], ku: ["KeyO"], kd: ["KeyL"] }
  };
  function bas(t, ad) { var a = KEY[t][ad].slice(); if (mod === 1 && t === 0) { if (ad === "u") a.push("ArrowUp"); if (ad === "d") a.push("ArrowDown"); if (ad === "l") a.push("ArrowLeft"); if (ad === "r") a.push("ArrowRight"); if (ad === "sut") a.push("Space"); if (ad === "pas") a.push("KeyX"); } return a.some(function (k) { return Px.k[k]; }); }
  function bas1(t, ad) { var a = KEY[t][ad].slice(); if (mod === 1 && t === 0) { if (ad === "sut") a.push("Space"); if (ad === "pas") a.push("KeyX"); } return a.some(function (k) { return Px.p[k]; }); }

        if (Math.abs(p.x - kale) < 82 && p.cd === 0 && Math.random() < .06 * (zor + .5)) { aim(p, kale); sut(p, .5 + Math.random() * .5); }
        else if (p.cd === 0 && Math.random() < .006) { aim(p, null); pas(p); }
      }
    } else {
      tx = Px.sinir(top_.x + yon * 38, PL + 20, PR - 20); ty = top_.y < CY ? PB - 30 : PT + 30; sp = hiz * .8;
    }
    var dx = tx - p.x, dy = ty - p.y, n = Math.sqrt(dx * dx + dy * dy);
    if (n > 2) { p.vx = dx / n * sp; p.vy = dy / n * sp; p.yx = dx / n; p.yy = dy / n; } else { p.vx = p.vy = 0; }
  }
  function aim(p, kale) { if (kale === null) return; var dx = kale - p.x, dy = Px.sinir(CY + Px.rastgele(-12, 12), GT + 3, GB - 3) - p.y, n = Math.sqrt(dx * dx + dy * dy) || 1; p.yx = dx / n; p.yy = dy / n; }
  function kaleciGuncelle(p) {
    var insanMi = elle && insanlar.some(function (h) { return h.t === p.t; });
    var hy = p.y;
    if (insanMi) {
      var r = document.getElementById(p.t === 0 ? "kr1" : "kr2"), v = +r.value;
      if (bas(p.t, "ku")) v = Math.max(0, v - 3); if (bas(p.t, "kd")) v = Math.min(100, v + 3); r.value = v;
      var hedef = GT - 6 + v / 100 * (GB - GT + 12); p.vy = Px.sinir(hedef - p.y, -1.3, 1.3);
    } else {
      var hedef2 = Px.sinir(top.y + top.vy * 3, GT - 2, GB + 2), uzak = Math.abs(top.x - p.x);

    }
    p.vx = 0; p.y = Px.sinir(p.y + p.vy, GT - 8, GB + 8); p.yx = p.t === 0 ? 1 : -1;
    var d = mesafe(p, top);
    if (d < 8 && p.cd === 0) { top.vx = (p.t === 0 ? 1 : -1) * (2 + Math.random() * 1.2); top.vy = (top.y - p.y) * .25 + Px.rastgele(-1, 1); p.cd = 10; Px.ses("vur"); top.gol = 0; top.son = p.t; for (var i = 0; i < 4; i++) parc.push({ x: top.x, y: top.y, vx: Px.rastgele(-1, 1), vy: Px.rastgele(-1, 1), o: 10, c: "#a7f070" }); }
  }
  function insanGuncelle(h) {

    var ux = (bas(t, "r") ? 1 : 0) - (bas(t, "l") ? 1 : 0), uy = (bas(t, "d") ? 1 : 0) - (bas(t, "u") ? 1 : 0);

    var diger = oyunculari(t).filter(function (q) { return q !== c; })[0]; botGuncelle(diger, false);

  }
  function gol(t) {
    skor[t]++; yazBaslik(); mesaj = "GOL! " + (t === 0 ? "KIRMIZI" : "MAVİ"); msayac = 130; sars = 14; Px.ses("gol");
    top.gol = 1; top.vx = top.vy = 0; top.x = Px.sinir(top.x, PL - 4, PR + 4);
    for (var i = 0; i < 40; i++) parc.push({ x: t === 0 ? PR + 4 : PL - 4, y: CY, vx: Px.rastgele(-2.5, 2.5), vy: Px.rastgele(-3, 1), o: 50, c: ["#ffcd75", "#fff", "#e0344f", "#41a6f6", "#a7f070"][i % 5] });

  }

      else Px.sonuc2(t0 === t1 ? "Berabere! " + t0 + " - " + t1 : (t0 > t1 ? "Kırmızı" : "Mavi") + " takım kazandı! " + t0 + " - " + t1);
    }, 1200);
  }
  function guncelle() {
    tik++; if (sars) sars--; if (msayac) msayac--;
    parc.forEach(function (q) { q.x += q.vx; q.y += q.vy; q.vy += .05; q.o--; }); parc = parc.filter(function (q) { return q.o > 0; });
    if (!calis) return;
    if (gw > 0) { gw--; if (gw === 0) { dizil2(); top.x = CX; top.y = CY; top.vx = top.vy = 0; top.gol = 0; msayac = 0; say = 150; sayNo = 0; } return; }
    if (say > 0) { var no = Math.ceil(say / 50); if (no !== sayNo) { sayNo = no; Px.ses("tik"); } say--; if (say === 0) { mesaj = "BAŞLA!"; msayac = 50; Px.ses("puan"); } return; }
    if (!bitis && !top.gol) { sure--; if (sure <= 0) { if (skor[0] === skor[1]) { altin = true; sure = 0; mesaj = "ALTIN GOL!"; msayac = 80; } else { mesaj = "MAÇ BİTTİ"; msayac = 80; bitir(); } } }
    if (altin && sure < 0) sure = 0;
    if (bitis) { return; }
    var kontrolEden = {};
    insanlar.forEach(function (h) { kontrolEden[pl.indexOf(h.c)] = 1; });
    // oyuncular
    insanlar.forEach(insanGuncelle);
    pl.forEach(function (p, i) {
      if (p.rol === "k") { kaleciGuncelle(p); }
      else if (!insanlar.some(function (h) { return h.c === p; }) && !(insanlar.some(function (h) { return h.t === p.t; }) && false)) {
        if (!insanlar.some(function (h) { return h.t === p.t; }) || true) { if (!insanlar.some(function (h) { return h.t === p.t && oyunculari(p.t).indexOf(p) >= 0 && h.c !== p && true; })) botGuncelle(p, true); }
      }
      if (p.cd) p.cd--;
    });
    pl.forEach(function (p) {

      if (p.vx || p.vy) p.f += .22;
    });

    for (var i = 0; i < pl.length; i++) for (var j = i + 1; j < pl.length; j++) {
      var a = pl[i], b = pl[j]; if (a.rol === "k" && b.rol === "k") continue;
      var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);

  function ciz() {

    x.fillStyle = "#0d0e1a"; x.fillRect(0, 0, W, 14);

    });

    x.fillStyle = "#0d0e1a"; x.fillRect(Math.round(top.x) - 3, Math.round(top.y) - 3, 6, 6);
    x.fillStyle = "#fff"; x.fillRect(Math.round(top.x) - 2, Math.round(top.y) - 2, 4, 4);
    x.fillStyle = "#1a1c2c"; var ph = Math.floor(top.d / 20) % 2 ? 1 : 0; x.fillRect(Math.round(top.x) - 1 + ph, Math.round(top.y) - 1, 2, 2);
    parc.forEach(function (q) { x.fillStyle = q.c; x.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); });
    // skor tabelası
    var sn = Math.ceil(sure / 60), dk = Math.floor(sn / 60), sc = sn % 60;
    Px.yazi(x, "KIR " + skor[0], 6, 2, 9, "#ffb0b0"); Px.yazi(x, skor[1] + " MAV", W - 6, 2, 9, "#b0d8ff", "right");
    Px.yazi(x, altin ? "ALTIN" : dk + ":" + (sc < 10 ? "0" : "") + sc, CX, 2, 9, "#ffcd75", "center");
    if (say > 0 && calis) { Px.yazi(x, "HAZIRLAN", CX, 40, 12, "#fff", "center"); Px.yazi(x, String(Math.ceil(say / 50)), CX, 54, 34, "#ffcd75", "center"); }
    else if (msayac > 0 && calis) { var gm = mesaj.indexOf("GOL") === 0; Px.yazi(x, mesaj, CX, gm ? 52 : 56, gm ? 18 : 22, gm ? "#ffcd75" : "#fff", "center"); }
    x.restore();
  }
  function kurPad() {
    var py = document.getElementById("padyer"); py.innerHTML = "";
    function ekle(t) {
      var d = document.createElement("div"); py.appendChild(d); var K = KEY[t];
      var sut = K.sut[0], pas_ = K.pas[0], u = K.u[0], dd = K.d[0], l = K.l[0], r = K.r[0];
      if (t === 0 && mod === 1) { /* tek kişilikte aynı tuş kodları (WASD) kullanılır */ }
      d.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:10px;flex:1 1 300px;min-width:0";
      var yon = document.createElement("div"), ak = document.createElement("div"); d.appendChild(yon); d.appendChild(ak);
      Px.pad(yon, [{ t: "◀", k: l, a: "Sol" }, { t: "▲", k: u, a: "Yukarı" }, { t: "▼", k: dd, a: "Aşağı" }, { t: "▶", k: r, a: "Sağ" }]);
      Px.pad(ak, [{ t: "ŞUT", k: sut, a: "Şut" }, { t: "PAS", k: pas_, a: "Pas" }], "fut-ak");
    }
    ekle(0); if (mod === 2) ekle(1);
    document.getElementById("kb1").style.display = elle ? "flex" : "none"; document.getElementById("kb2").style.display = elle && mod === 2 ? "flex" : "none";
  }
  function basla(m, z) {
    mod = m; zor = z;
    document.getElementById("ipucu").textContent = m === 1
      ? "★ ŞUT: F veya BOŞLUK (basılı tut = daha güçlü, bırakınca vurur) · PAS: G veya X (öndeki takım arkadaşına gider) · Hareket: WASD / ok tuşları. Ekrandaki ŞUT ve PAS düğmeleri de çalışır." + (elle ? " Kaleci: Q/E ya da çubuk." : "")
      : "★ Kırmızı: WASD yürü, F = ŞUT (basılı tut = güçlü), G = PAS" + (elle ? ", Q/E kaleci" : "") + " · Mavi: oklar yürü, ENTER = ŞUT, Sağ Shift veya / = PAS" + (elle ? ", O/L kaleci" : "") + ". (Sıralamaya yazılmaz)";
    kurPad(); yeni();
  }
  var son = { m: 1, z: 1 };
  var menu = Px.menu({ baslik: "FUTBOL", not: "2'ye 2 mini maç · 90 saniye", secenekler: [
    { ad: "1 Oyuncu · Kolay", alt: "Bota karşı", fn: function () { son = { m: 1, z: 0 }; basla(1, 0); } },
    { ad: "1 Oyuncu · Normal", alt: "Bota karşı · sıralamaya yazılır", fn: function () { son = { m: 1, z: 1 }; basla(1, 1); } },
    { ad: "1 Oyuncu · Zor", alt: "Hızlı bot", fn: function () { son = { m: 1, z: 2 }; basla(1, 2); } },
    { ad: "2 Oyuncu", alt: "Aynı ekranda · sıralamasız", fn: function () { son = { m: 2, z: 1 }; basla(2, 1); } }
  ], ek: function (m) {
    var b = document.createElement("button"); b.type = "button"; b.className = "btn ikinci"; b.textContent = "Kaleci: OTOMATİK";
    b.addEventListener("click", function () { elle = !elle; b.textContent = "Kaleci: " + (elle ? "ÇUBUKLA ELLE" : "OTOMATİK"); Px.ses("tik"); });
    m.appendChild(b);
  } });
  dizil(); skor = [0, 0]; sure = SURE; calis = false; tik = 0; parc = []; insanlar = []; mesaj = ""; msayac = 0;
  document.getElementById("tekrar").addEventListener("click", function () { basla(son.m, son.z); });
  document.getElementById("menuBtn").addEventListener("click", function () { calis = false; menu.ac(); });
  Px.dongu(guncelle, ciz);
})();
