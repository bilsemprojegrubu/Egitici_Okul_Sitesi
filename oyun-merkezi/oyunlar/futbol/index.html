    x.fillStyle = "#1a1c2c"; var ph = Math.floor(top.d / 20) % 2 ? 1 : 0; x.fillRect(bx - 1 + ph, by - 1, 2, 2);
    if (sp && calis) { var oy = Math.round(Math.sin(tik / 6) * 2); x.fillStyle = "#0d0e1a"; x.fillRect(Math.round(sp.rc.x) - 3, Math.round(sp.rc.y) - 20 + oy, 7, 5); x.fillStyle = "#ffcd75"; x.fillRect(Math.round(sp.rc.x) - 2, Math.round(sp.rc.y) - 19 + oy, 5, 2); x.fillRect(Math.round(sp.rc.x) - 1, Math.round(sp.rc.y) - 17 + oy, 3, 1);
      if (insanlar.some(function (h) { return h.t === sp.t; }) && sp.bek >= 35) Px.yazi(x, "K: YERDEN · H: HAVADAN" + (sp.tur === "tac" ? " · O: TAÇ" : ""), CX, 140, 6, "#fff", "center"); }
    if (top.z > 2 && !sp && insanlar.some(function (h) { return h.t === top.son; }) && top.son >= 0) Px.yazi(x, "I: KAFA", CX, 140, 6, "#ffcd75", "center");
    }
    parc.forEach(function (q) { x.fillStyle = q.c; x.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); });
    // skor tabelası
    var sn = Math.ceil(sure / 60), dk = Math.floor(sn / 60), sc = sn % 60;
    Px.yazi(x, "KIR " + skor[0], 6, 2, 9, "#ffb0b0"); Px.yazi(x, skor[1] + " MAV", W - 6, 2, 9, "#b0d8ff", "right");
    Px.yazi(x, pen ? "PENALTI" : (uzat ? "UZATMA " : "") + dk + ":" + (sc < 10 ? "0" : "") + sc, CX, 2, 9, "#ffcd75", "center");
    if (pen) {
      [0, 1].forEach(function (t) {
        var m = Math.max(5, pen.log[t].length); Px.yazi(x, t === 0 ? "KIR" : "MAV", t === 0 ? 6 : W - 6, 24 + t * 0, 7, t === 0 ? "#ffb0b0" : "#b0d8ff", t === 0 ? "left" : "right");
        for (var q = 0; q < m; q++) { var r = pen.log[t][q], cx = t === 0 ? 30 + q * 7 : W - 34 - q * 7; x.fillStyle = "#0d0e1a"; x.fillRect(cx - 1, 23, 6, 6); x.fillStyle = r === 1 ? "#a7f070" : r === 0 ? "#e0344f" : "#566c86"; x.fillRect(cx, 24, 4, 4); }
      });
    }
    if (say > 0 && calis) { Px.yazi(x, "HAZIRLAN", CX, 40, 12, "#fff", "center"); Px.yazi(x, String(Math.ceil(say / 50)), CX, 54, 34, "#ffcd75", "center"); Px.atlaYazi(x, CX, 98); }
    else if (rp) { if (Math.floor(tik / 15) % 2 === 0 || rp.t < 20) Px.yazi(x, "GOL TEKRARI", 6, 14, 9, "#ffcd75", "left"); Px.yazi(x, "atlamak için bir tuşa bas", W - 4, H - 6, 6, "#fff", "right"); }
    else if (msayac > 0 && calis) { var gm = mesaj.indexOf("GOL") === 0; Px.yazi(x, mesaj, CX, gm ? 52 : 56, gm ? 18 : 22, gm ? "#ffcd75" : "#fff", "center"); }
    x.restore();
  }
  function kurPad() {

    }

    document.getElementById("kb1").style.display = elle ? "flex" : "none"; document.getElementById("kb2").style.display = elle && mod === 2 ? "flex" : "none";
  }
  function basla(m, z) {
    mod = m; zor = z;
    document.getElementById("ipucu").textContent = m === 1
      ? "★ Hareket: WASD / ok tuşları (top ayağına yapışır; rakip topu çalabilir, sen de çalabilirsin) · E: ŞUT (basılı tut = güçlü) · Q: PAS · X: HAVADAN pas · C: havadan gelen topa KAFA, V: RÖVEŞATA (tam üstündeyken) · kaleci topu tutunca Z/Q yerden, X havadan at · R: taç · Z: korner/taçta yerden atış (korner ve taçta Z, X, R). Ekrandaki düğmeler de çalışır." + (elle ? " Kaleci: T/G ya da çubuk." : "")
      : "★ Kırmızı: WASD yürü, E ŞUT (basılı tut = güçlü), Q PAS, Z yerden korner, X HAVADAN, C KAFA, V RÖVEŞATA, R TAÇ" + (elle ? ", T/G kaleci" : "") + " · Mavi: O ileri, K geri, L sağ, Ş sol, P ŞUT, I PAS, M yerden korner, Ö HAVADAN, Ç KAFA, / RÖVEŞATA, Ğ TAÇ" + (elle ? ", U/J kaleci" : "") + ". (Sıralamaya yazılmaz)";
    kurPad(); yeni();
  }
  var son = { m: 1, z: 1 };

    { ad: "1 Oyuncu · Kolay", alt: "Bota karşı", fn: function () { son = { m: 1, z: 0 }; basla(1, 0); } },

    { ad: "2 Oyuncu", alt: "Aynı ekranda · sıralamasız", fn: function () { son = { m: 2, z: 1 }; basla(2, 1); } }
  ], ek: function (m) {

    b.addEventListener("click", function () { elle = !elle; b.textContent = "Kaleci: " + (elle ? "ÇUBUKLA ELLE" : "OTOMATİK"); Px.ses("tik"); });

    m.appendChild(t);
  } });
