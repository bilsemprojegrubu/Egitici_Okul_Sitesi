<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piksel Balık — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
</head>
<body data-oyun="balik">
<header class="ust"><a class="geri" href="../../index.html">&lt; Merkez</a><h1>PİKSEL BALIK</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Can <b id="can">3</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne yan">
  <canvas id="c" class="cv" width="240" height="160" style="--mw:480px;touch-action:none"></canvas>
  <div class="pad-ikili pad-yan"><div class="pad yatay k-sol" id="yonpad"><button class="btn l" id="solb" type="button" aria-label="Sol">◀ SOL</button><button class="btn r" id="sagb" type="button" aria-label="Sağ">SAĞ ▶</button></div><div class="pad k-sag"><button class="btn u" id="yukari" type="button" aria-label="Yukarı">▲ YUKARI</button><button class="btn d" id="asagi" type="button" aria-label="Aşağı">▼ AŞAĞI</button></div></div>
  <div class="k-sag" id="joyk" hidden></div><button class="btn ikinci" id="kontrolb" type="button" style="align-self:center;justify-self:center;margin-top:8px">🕹 JOYSTICK</button>
  <p class="ipucu">Ekrana dokun/sürükle (veya ok tuşları / WASD / joystick) ile yüz. <b style="color:#38b764">Yeşil</b> çerçeveli küçük balıkları ye, büyü; <b style="color:#ef4d5e">kırmızı</b> çerçeveli büyüklerden kaç. Çok büyüyünce ekran uzaklaşır!</p>
  <div id="bitti" class="kaplama" hidden>
    <h2>Oyun bitti</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script src="../piksel.js"></script>
<script>
// Piksel Balık: sonsuz okyanus, kamera balık büyüdükçe uzaklaşır
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d"), W = 240, H = 160;
  var MINW = 150;                       // en yakın görüş genişliği (dünya birimi)
  var oy, bal, ak, kabarcik = [], par = [], yazi = [], puan, can, kombo, kombS, yan, kam, hedef, calis, bekle, zaman;
  var renk = ["#73eff7", "#a7f070", "#ffcd75", "#ef7d57", "#b55088", "#f4f4f4"];
  try { document.getElementById("rekor").textContent = Skor.rekor("balik"); } catch (e) { }
  function ya() { document.getElementById("puan").textContent = puan; document.getElementById("can").textContent = can; }

  // balık çizimi: s = gövde yarı uzunluğu (dünya birimi)
  function balikCiz(cx, cy, s, kol, yon, cerceve, kopek, agiz) {
    var u = s / 4, w = 8 * u, h = 5 * u;
    x.save(); x.translate(cx, cy); x.scale(yon, 1);
    x.fillStyle = kol; x.fillRect(-w / 2, -h / 2 + u, w, h - 2 * u); x.fillRect(-w / 2 + u, -h / 2, w - 3 * u, h);
    x.fillRect(-w / 2 - 2 * u, -h / 2 + u, 2 * u, h - 2 * u); x.fillRect(-w / 2 - 3 * u, -h / 2, u, u); x.fillRect(-w / 2 - 3 * u, h / 2 - u, u, u);
    if (kopek) { x.fillRect(-u, -h / 2 - u * 1.5, 2.5 * u, 1.5 * u); x.fillStyle = "#f4f4f4"; x.fillRect(-w / 2 + u, h / 2 - 2 * u, w - 3 * u, u); }
    x.fillStyle = "#f4f4f4"; x.fillRect(w / 2 - 3 * u, -h / 2 + u, 1.6 * u, 1.6 * u);
    x.fillStyle = "#0d0e1a"; x.fillRect(w / 2 - 2.4 * u, -h / 2 + 1.6 * u, u, u);
    if (agiz) { x.fillStyle = "#0d0e1a"; x.fillRect(w / 2 - 1.2 * u, u * .4, 1.2 * u, .6 * u); }
    x.restore();
    if (cerceve) { x.strokeStyle = cerceve; x.lineWidth = Math.max(.6, 1.4 / kam.z); x.strokeRect(cx - w / 2 - 3.5 * u, cy - h / 2 - u, w + 4.5 * u, h + 2 * u); }
  }

  function yeni() {
    bal = { x: 0, y: 0, s: 6, yon: 1, vx: 0, vy: 0 }; oy = [];
    kam = { x: 0, y: 0, z: W / MINW }; puan = 0; can = 3; kombo = 0; kombS = 0; yan = 0; hedef = null; calis = true; bekle = 30; zaman = 0; par = []; yazi = [];
    kabarcik = []; for (var i = 0; i < 40; i++) kabarcik.push({ x: Px.rastgele(-400, 400), y: Px.rastgele(-300, 300), r: Px.rastgele(1, 3), v: Px.rastgele(.1, .6), p: Px.rastgele(.2, .9) });
    for (i = 0; i < 30; i++) yarat(true);
    document.getElementById("bitti").hidden = true; ya();
  }
  function gorus() { return Math.max(MINW, bal.s * 16); }
  function yarat(ilk) {
    var gw = gorus(), gh = gw * H / W, r = Math.random(), oran;
    if (r < .58) oran = Px.rastgele(.3, .9); else if (r < .82) oran = Px.rastgele(.9, 1.3); else if (r < .96) oran = Px.rastgele(1.4, 2.4); else oran = Px.rastgele(2.8, 4.2);
    var s = Math.max(1.5, bal.s * oran), yon = Math.random() < .5 ? -1 : 1, ax, ay;
    if (ilk) { ax = bal.x + Px.rastgele(-gw, gw); ay = bal.y + Px.rastgele(-gh, gh); if (Math.abs(ax - bal.x) < gw * .3 && Math.abs(ay - bal.y) < gh * .3) { if (oran > 1.2) ax = bal.x + yon * gw * .75; } }
    else { ax = bal.x + yon * -1 * (gw * .65 + s * 4); ay = bal.y + Px.rastgele(-gh * .8, gh * .8); }
    oy.push({ x: ax, y: ay, s: s, yon: yon, v: Px.rastgele(.25, .7) * Math.sqrt(Math.max(1, s / 6)) * (oran > 2 ? .8 : 1), kol: oran > 2.6 ? "#8b9bb4" : renk[Px.tamsayi(0, renk.length - 1)], dal: Px.rastgele(0, 6), kopek: oran > 2.6 });
  }
  function patla(px, py, kol, n) { for (var i = 0; i < n; i++) par.push({ x: px, y: py, vx: Px.rastgele(-1, 1) * bal.s * .2, vy: Px.rastgele(-1, 1) * bal.s * .2, r: kol, o: 24 }); }

  function guncelle() {
    if (!calis) return;
    zaman++;
    var k = Px.k, dx = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0), dy = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    var hiz = 1.9 * Math.pow(bal.s / 6, .55) * 0.9 + .6;
    if (dx || dy) { hedef = null; var n = Math.sqrt(dx * dx + dy * dy); bal.vx += (dx / n * hiz - bal.vx) * .12; bal.vy += (dy / n * hiz - bal.vy) * .12; }
    else if (hedef) {
      var ex = hedef.x - bal.x, ey = hedef.y - bal.y, m = Math.sqrt(ex * ex + ey * ey);
      if (m > bal.s * .5) { bal.vx += (ex / m * hiz - bal.vx) * .12; bal.vy += (ey / m * hiz - bal.vy) * .12; } else { bal.vx *= .85; bal.vy *= .85; }
    } else { bal.vx *= .9; bal.vy *= .9; }
    bal.x += bal.vx; bal.y += bal.vy; if (Math.abs(bal.vx) > .15) bal.yon = bal.vx > 0 ? 1 : -1;
    if (yan) yan--; if (kombS > 0) { kombS--; if (!kombS) kombo = 0; }
    var gw = gorus(), gh = gw * H / W;
    // düşmanlar
    for (var i = oy.length - 1; i >= 0; i--) {
      var o = oy[i]; o.dal += .05; o.x += o.yon * o.v; o.y += Math.sin(o.dal) * .12 * o.s * .1;
      if (Math.abs(o.x - bal.x) > gw * 1.7 || Math.abs(o.y - bal.y) > gh * 2.4) { oy.splice(i, 1); continue; }
      if (bekle > 0) continue;
      var d = Math.sqrt((o.x - bal.x) * (o.x - bal.x) + (o.y - bal.y) * (o.y - bal.y)), esik = (o.s + bal.s) * .55;
      if (d < esik) {
        if (bal.s >= o.s * 1.05) {
          kombo = kombS > 0 ? Math.min(5, kombo + 1) : 1; kombS = 100;
          var kz = Math.max(1, Math.round(o.s / bal.s * 10 + 1)) * kombo; puan += kz * 2; // büyük balık = daha çok puan
          bal.s = Math.sqrt(bal.s * bal.s + o.s * o.s * .22);
          patla(o.x, o.y, o.kol, 8); yazi.push({ t: "+" + kz * 2 + (kombo > 1 ? " x" + kombo : ""), x: o.x, y: o.y, o: 40 }); Px.ses("tik"); oy.splice(i, 1); ya();
        } else if (o.s > bal.s * 1.05 && !yan) {
          can--; yan = 110; patla(bal.x, bal.y, "#ef4d5e", 12); Px.ses("patlama"); ya();
          var ang = Math.atan2(bal.y - o.y, bal.x - o.x); bal.vx = Math.cos(ang) * hiz * 2.5; bal.vy = Math.sin(ang) * hiz * 2.5; kombo = 0;
          if (can <= 0) { calis = false; Px.ses("kaybet"); Skor.oyunBitti("balik", puan); return; }
        }
      }
    }
    if (bekle > 0) bekle--;
    while (oy.length < 30 + Math.min(8, Math.floor(bal.s / 20))) yarat(false);
    // kamera: balık ekranı çok kaplayınca uzaklaş
    var hz = W / gorus(); kam.z += (hz - kam.z) * .04;
    kam.x += (bal.x - kam.x) * .1; kam.y += (bal.y - kam.y) * .1;
    par.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.o--; }); par = par.filter(function (p) { return p.o > 0; });
    yazi.forEach(function (t) { t.y -= bal.s * .04; t.o--; }); yazi = yazi.filter(function (t) { return t.o > 0; });
  }
  function ciz() {
    var gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#1b6fb0"); gr.addColorStop(1, "#08284a"); x.fillStyle = gr; x.fillRect(0, 0, W, H);
    // ışık huzmeleri (paralaks)
    x.fillStyle = "rgba(255,255,255,.05)";
    for (var j = 0; j < 5; j++) { var lx = ((j * 61 - kam.x * kam.z * .15) % (W + 60) + W + 60) % (W + 60) - 30; x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx + 24, 0); x.lineTo(lx - 20, H); x.lineTo(lx - 44, H); x.fill(); }
    x.save(); x.translate(W / 2, H / 2); x.scale(kam.z, kam.z); x.translate(-kam.x, -kam.y);
    // kabarcıklar (sonsuz döşeme)
    var gw = W / kam.z, gh = H / kam.z, TW = 800, TH = 600;
    x.fillStyle = "rgba(255,255,255,.35)";
    kabarcik.forEach(function (b) {
      b.y -= b.v; var px = b.x + Math.floor((kam.x - b.x) / TW + .5) * TW, py = b.y + Math.floor((kam.y - b.y) / TH + .5) * TH;
      x.fillRect(px, py, b.r / Math.max(.5, kam.z * .8) * 1.2, b.r / Math.max(.5, kam.z * .8) * 1.2);
    });
    oy.slice().sort(function (a, b) { return a.s - b.s; }).forEach(function (o) {
      var cer = bal.s >= o.s * 1.05 ? "#38b764" : o.s > bal.s * 1.05 ? "#ef4d5e" : "#ffcd75";
      balikCiz(o.x, o.y, o.s, o.kol, o.yon, cer, o.kopek, o.kopek);
    });
    if (!yan || Math.floor(yan / 5) % 2 === 0) balikCiz(bal.x, bal.y, bal.s, "#ffcd75", bal.yon, null, false, false);
    par.forEach(function (p) { x.fillStyle = p.r; var q = Math.max(1, bal.s * .12); x.fillRect(p.x, p.y, q, q); });
    x.restore();
    yazi.forEach(function (t) { Px.yazi(x, t.t, W / 2 + (t.x - kam.x) * kam.z, H / 2 + (t.y - kam.y) * kam.z - 8, 9, "#ffcd75", "center"); });
    // boyut çubuğu
    Px.yazi(x, "BOYUT " + Math.round(bal.s / 6 * 10) / 10 + "x", 4, 3, 8, "#f4f4f4", "left");
    if (kombo > 1) Px.yazi(x, "KOMBO x" + kombo, W - 4, 3, 8, "#ffcd75", "right");
    if (kam.z < W / MINW * .97) Px.yazi(x, "UZAKLAŞTI", W / 2, H - 12, 7, "rgba(255,255,255,.55)", "center");
  }
  function konum(e) { var k = C.getBoundingClientRect(); return { x: kam.x + ((e.clientX - k.left) / k.width * W - W / 2) / kam.z, y: kam.y + ((e.clientY - k.top) / k.height * H - H / 2) / kam.z }; }
  C.addEventListener("pointerdown", function (e) { e.preventDefault(); hedef = konum(e); });
  C.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "mouse") hedef = konum(e); });
  [["solb", "ArrowLeft"], ["sagb", "ArrowRight"], ["yukari", "ArrowUp"], ["asagi", "ArrowDown"]].forEach(function (p) {
    var el = document.getElementById(p[0]);
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) { } Px.k[p[1]] = true; hedef = null; });
    ["pointerup", "pointercancel"].forEach(function (n) { el.addEventListener(n, function () { Px.k[p[1]] = false; }); });
  });
  // Kontrol seçeneği: BUTONLAR / JOYSTICK (seçim hatırlanır)
  (function () {
    var yp = document.getElementById("yonpad"), sag = yp.nextElementSibling, jk = document.getElementById("joyk"), kb = document.getElementById("kontrolb"), joy = null;
    function uygula(j) {
      if (j && !joy) joy = Px.joystick(jk, { l: "ArrowLeft", r: "ArrowRight", u: "ArrowUp", d: "ArrowDown" });
      yp.style.display = sag.style.display = j ? "none" : ""; jk.hidden = !j; jk.style.display = j ? "flex" : "none";
      kb.textContent = j ? "🔘 BUTONLAR" : "🕹 JOYSTICK";
      if (!j) ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].forEach(function (c) { Px.k[c] = false; });
    }
    kb.addEventListener("click", function () { var j = jk.hidden; Px.yaz("kontrol_balik", j ? "joy" : "btn"); uygula(j); });
    uygula(Px.oku("kontrol_balik", "btn") === "joy");
  })();
  document.getElementById("tekrar").addEventListener("click", yeni);
  yeni(); Px.dongu(guncelle, ciz);
})();
</script>
</body>
</html>
