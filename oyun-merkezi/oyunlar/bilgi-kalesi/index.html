<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kale Savaşı — Oyun Merkezi</title>
<link rel="stylesheet" href="../ortak.css">
<style>
.sahne{max-width:1260px}
.oyunalan{display:flex;gap:8px;align-items:flex-start;justify-content:center;width:100%}
#c{width:var(--cw,100%)!important;max-width:none!important;flex:none}
.pnl{display:flex;gap:10px;width:min(100%,860px);justify-content:space-between;align-items:flex-start}
.pnl[hidden]{display:none}
.pn{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pn .btn{font-size:.62rem;padding:4px 2px;min-height:44px;line-height:1.15;white-space:pre-line}
.btn[hidden]{display:none}
.pn .btn.yok{opacity:.45}
.pn .btn.sec{background:#ffcd75;color:#0d0e1a}
.pn .baslik{grid-column:1/-1;font-size:.7rem;text-align:center;opacity:.9}
/* Sağ menü (1 oyuncu) */
.yan{flex:none;width:var(--pw,260px);display:flex;flex-direction:column;gap:4px;background:#262b44;border:3px solid #0d0e1a;outline:2px solid #566c86;padding:5px;overflow:hidden;align-self:flex-start}
.yan[hidden]{display:none}
.yb{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:#ffcd75;padding:0 2px}
.yb b{font-size:.9rem}
.sek{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.sek button{font:inherit;font-weight:900;font-size:.56rem;padding:4px 1px;background:#3b5dc9;color:#f4f4f4;border:2px solid #0d0e1a;cursor:pointer;line-height:1.1;min-height:34px;text-shadow:1px 1px 0 #0d0e1a}
.sek button.sec{background:#ffcd75;color:#0d0e1a;text-shadow:none}
.ic{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;min-height:0;padding-right:2px;scrollbar-width:thin}
.sr{display:flex;flex-direction:column;gap:1px;text-align:left;background:#41a6f6;color:#0d0e1a;border:2px solid #0d0e1a;padding:3px 5px;font:inherit;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.35);line-height:1.15;min-height:38px;flex:none}
.sr.t1{background:#a7f070}.sr.t2{background:#ef7d57}.sr.t3{background:#c58cf0}.sr.t4{background:#ffcd75}
.sr .a{display:flex;justify-content:space-between;gap:4px;font-size:.68rem;font-weight:900}
.sr .a i{font-style:normal;white-space:nowrap}
.sr .b{display:flex;justify-content:space-between;gap:4px;font-size:.56rem;font-weight:700;opacity:.85}
.sr .kb{background:#0d0e1a;color:#ffcd75;padding:0 3px;font-size:.56rem;font-weight:900}
.sr.yok{opacity:.5}
.sr.ak{outline:2px solid #fff}
.sr:active{transform:translateY(1px)}
.alt{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.alt .sr{min-height:34px;align-items:center;flex-direction:row;justify-content:space-between}
.ytip{font-size:.54rem;color:#a0aec0;text-align:center;line-height:1.2}
@media (max-width:699px){
  .oyunalan{flex-direction:column;align-items:center}
  .yan{width:100%;max-width:860px}
  .ic{display:grid;grid-template-columns:1fr 1fr}
}
@media (hover:hover) and (pointer:fine){#padyer{display:none}}
</style>
</head>

  <div id="paneller" class="pnl" hidden></div>

</main>

  // ---- birlikler ----  (c: fiyat, hp, d: hasar, r: menzil, cd: bekleme, sp: hız, ok: 1 ok / 2 büyü / 3 kaya, arm: ok zırhı)

  // ---- boss'lar: 30 farklı (arch = bi % 10 gövde tipi; isim/palet/yetenek hepsi ayrı) ----
  var ABL = { zehir: "ZEHİRLER", "çağır": "ÇAĞIRIR", donma: "DONDURUR", alev: "ALEV SAÇAR", yenile: "YENİLENİR", kalkan: "KALKAN AÇAR", "şarj": "ATILIR", "sarsıntı": "YERİ SARSAR", "çalma": "CAN ÇALAR", "taş": "TAŞ FIRLATIR" };
  var MN = [6, 0, 0, 2, 0, 0, 3, 0, 6, 0];
  var BS = [
    ["ZEHİR ÖRÜMCEĞİ", "#3f7a1c", "#1a2a0a", "#b8ff30", "zehir"], ["TAŞ DEV", "#94a0b8", "#566c86", "#73eff7", "sarsıntı"],
    ["ATEŞ EJDERİ", "#e0344f", "#7a1a2a", "#ffcd75", "alev"], ["KEMİK KRAL", "#dfe9f5", "#8a96ac", "#b13e53", "çağır"],

    ["ALTIN AKREP", "#ffe08a", "#b8841a", "#ff6a2a", "sarsıntı"], ["BÜYÜK DEV", "#7a9a3a", "#3a4a1a", "#e0344f", "taş"]
  ];
  // 2 oyuncu tuş düzeni (eski, değişmedi)
  var KS = [["Digit1", "Digit2", "Digit3", "Digit4", "KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyF", "KeyG"], ["Digit7", "Digit8", "Digit9", "Digit0", "KeyU", "KeyI", "KeyO", "KeyP", "BracketLeft", "BracketRight", "KeyJ", "KeyK"]];

    ["KeyU", "tw0"], ["KeyI", "tw1"], ["KeyO", "tw2"], ["KeyP", "tw3"], ["KeyM", "tw4"], ["KeyS", "tw5"]];
  var TW = [
    { n: "ALTIN KULESİ", c: 120 }, { n: "OKÇU KULESİ", c: 95 }, { n: "ŞİFA KULESİ", c: 110 }, { n: "BUZ KULESİ", c: 100 },
    { n: "GÜÇ KULESİ", c: 130 }, { n: "HIZ KULESİ", c: 130 }
  ];
  var btn = [[], []], rows = {}, yanEl = null, listEl = null;

  function hasC(s) { return mod === 2 || s === 1; }
  function maxM() { return mod === 1 ? 20 : 3; } // 1 oyuncuda 4 kat x 5 maden
  function maxL() { return mod === 1 ? 20 : 8; }
  function cw(s) { return 22 + Math.min(S[s].lv, 12) * 2; }
  function chh(s) { return 30 + Math.min(S[s].lv, 12) * 3; }
  function mhp(s) { return 200 + S[s].lv * 170; }
  function front(s) { return s === 0 ? S[0].cx + cw(0) / 2 : S[1].cx - cw(1) / 2; }
  function mkS(cx, g) { return { cx: cx, g: g, lv: 0, hp: 200, mines: 1, ml: 0, em: 0, rg: 0, cr: 0, cs: 0, ch: 0, it: 0, tc: 30, cf: 0, ud: 0, uh: 0, us: 0, uk: 0, ub: 0, uc: 0, cz: 0, cy: 0, cg: 0, ct: 0, sA: 0, gr: 0, uy: 0, uq: 0, gd: 1, gs: 1, tw: [null, null, null, null, null, null, null, null, null, null, null, null] }; }
  // dalga ölçeği: eskisinden belirgin dik (enine büyüme + ikinci derece terim)
  function sc(n) { return 1 + .08 * n + .0006 * n * n; }
  function puan() { return mod === 1 ? Math.max(0, (wv - 1)) * 50 + kills : 0; }
  function yaz() { var p = puan(); if (p !== sonPuan) { sonPuan = p; document.getElementById("puan").textContent = p; } }
  function hmul(z) { return (1 + .1 * z.lv) * (1 + .12 * z.uh); }
  function dmul(z) { return (1 + .1 * z.lv) * (1 + .12 * z.ud); }
  function cdv(z, b) { return Math.round(b * (1 - .08 * z.uc)); }
  function pf(px, py, n, cols, l, sp) { for (var i = 0; i < n; i++) F.push({ x: px + Px.rastgele(-3, 3), y: py + Px.rastgele(-3, 3), vx: Px.rastgele(-sp, sp), vy: Px.rastgele(-sp, .3), l: l || 20, c: cols[i % cols.length] }); }
  // kuleler yolun iki yanında: çift slot arka sıra (6), tek slot ön sıra (6)

  function twDy(i) { return i & 1 ? 32 : -13; }
  function ro(wx) { return mod === 1 ? Math.round(wx * SLP) : 0; } // yol bize doğru hafif eğik
  function twHp(lv) { return 120 + lv * 70; }
  function twUp(t, lv) { return Math.round(TW[t].c * .85 * Math.pow(1.55, lv)); }
  function twSlots(s) { return 3 + S[s].uy; } // KAPASİTE sekmesinden 12'ye kadar
  function mkTw(t, lv, i) { return { t: t, lv: lv, i: i, dy: twDy(i), x: twX(i), hp: twHp(lv), mhp: twHp(lv), cd: 0, fl: 0, dead: 0, tw: 1, s: 1 }; }
  function twPlan(s, t) {

  }

  function yeni(m) {

  }
  function yapU(s, k, hm, dm) {
    var en = mod === 1 && s === 0, t = en ? EK[k] : UK[k], z = S[s];
    var u = { id: ++idc, s: s, k: k, x: 0, hp: t.hp * hm, mhp: t.hp * hm, d: t.d * dm, r: t.r, cd: 0, cdm: t.cd, sp: t.sp * (en ? 1 : 1 + .06 * z.us), ok: t.ok || 0, fl: 0, at: 0, w: 0, ly: ((idc * 5) % 7 - 3) * 2, boss: 0, fly: t.fly || 0, g: en ? Math.ceil(t.g * (1 + wv * .04)) : Math.round(t.c * .5), dead: 0, bi: 0, arm: t.arm || 0, hunt: t.hunt || 0, heal: t.heal ? t.heal * hm : 0, bomb: t.bomb || 0, pz: t.psn || 0, pd: 0, psn: 0, slow: 0, slowf: .55, frz: 0, sh: 0, cy: 0, chg: 0, def: null, twh: t.twh || 0, res: t.res || 0, bd: 1, bsp: 1 };

  function ucost(s, k) {
    var c = UK[k].c;

  }
  function ucap() { return mod === 1 ? 40 + 5 * S[1].uq : 25; }

  // ---- eylemler (menü + klavye aynı tabloyu kullanır) ----
  var A = {}, TABS = [[], [], [], [], []];
  function reg(id, tb, o) { o.id = id; o.tab = tb; A[id] = o; if (tb >= 0) TABS[tb].push(id); if (!o.ek) o.ek = function () { return ""; }; if (!o.nm) o.nm = function () { return o.n; }; return o; }
  UK.forEach(function (t, k) {
    reg("u" + k, 0, {
      n: t.n, cost: function (s) { return ucost(s, k); }, lim: function (s) { return say(s) < ucap() ? "" : "DOLU"; },
      run: function (s) { var z = S[s]; yapU(s, k, hmul(z), dmul(z)); Px.ses("tik"); },
