<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<body data-oyun="bilgi-kalesi">
<header class="ust"><a class="geri" href="../../index.html">&lt; Merkez</a><h1>KALE SAVAŞI</h1>
<div class="puanlar">Puan <b id="puan">0</b> · Rekor <b id="rekor">0</b></div></header>
<main class="sahne">
  <canvas id="c" class="cv" width="280" height="150" style="--mw:860px"></canvas>
  <p class="ipucu" id="ipucu"></p>
  <div id="padyer"></div>
  <div id="paneller" class="pnl"></div>
  <div id="bitti" class="kaplama" hidden>
    <h2>Kale düştü</h2><p id="sonuc"></p>
    <div id="siralama" class="siralama" hidden></div>
    <button class="btn" id="tekrar">Tekrar oyna</button>
    <button class="btn ikinci" id="menuBtn">Menü</button>
  </div>
</main>
<script src="../../config.js"></script>
<script src="../../skor.js"></script>
<script src="../piksel.js"></script>
<script>
// Kale Savaşı. 1 oyuncu: kale SAĞDA, düşmanlar soldaki mağaradan uzun bir yoldan gelir (sonsuz dalga, her 10'da boss).
// 2 oyuncu: iki kale karşılıklı, tek ekranda (sıralamaya yazılmaz).
(function () {
  var C = document.getElementById("c"), x = C.getContext("2d"), GY = 122, VW = 280, WW = 1000;
  var mod = 1, cam = 0, tik = 0, calis = false, S, U, P, F, wv, kills, sars, idc = 0, mesaj = "", msayac = 0, over = 0, wq, wt, wsp, wi, wf, sonPuan = -1;
  var UK = [
    { n: "KILIÇ", c: 25, hp: 40, d: 6, r: 9, cd: 30, sp: .38 },
    { n: "MIZRAK", c: 30, hp: 32, d: 5, r: 17, cd: 28, sp: .4 },
    { n: "OKÇU", c: 40, hp: 22, d: 5, r: 60, cd: 42, sp: .3, ok: 1 },
    { n: "BÜYÜCÜ", c: 75, hp: 22, d: 13, r: 90, cd: 75, sp: .26, ok: 2 }
  ];
  var EK = [
    { n: "GOBLIN", hp: 22, d: 3, r: 8, cd: 32, sp: .45, g: 4 },
    { n: "ORK", hp: 60, d: 7, r: 10, cd: 38, sp: .3, g: 8 },
    { n: "İSKELET", hp: 20, d: 4, r: 50, cd: 48, sp: .3, g: 7, ok: 1 },
    { n: "YARASA", hp: 14, d: 3, r: 7, cd: 26, sp: .85, g: 5, fly: 1 },
    { n: "DEV", hp: 170, d: 15, r: 12, cd: 55, sp: .2, g: 22 },
    { n: "KARA BÜYÜCÜ", hp: 40, d: 10, r: 75, cd: 70, sp: .25, g: 14, ok: 2 }
  ];
  var BN = ["ORMAN CANAVARI", "TAŞ DEV", "KEMİK KRAL", "ATEŞ EJDERİ", "BUZ ŞÖVALYESİ", "ZEHİR ÖRÜMCEĞİ", "GÖLGE LORDU", "ALTIN GOLEM"];
  var BP = [["#38b764", "#257179", "#ffcd75"], ["#94a0b8", "#566c86", "#73eff7"], ["#dfe9f5", "#94a0b8", "#b13e53"], ["#e0344f", "#b13e53", "#ffcd75"],
    ["#73c7f9", "#3b5dc9", "#fff"], ["#5d275d", "#1a1c2c", "#a7f070"], ["#333c57", "#1a1c2c", "#b55ee0"], ["#ffcd75", "#c98a4b", "#fff"]];
  var KS = [["Digit1", "Digit2", "Digit3", "Digit4", "KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY"], ["Digit7", "Digit8", "Digit9", "Digit0", "KeyU", "KeyI", "KeyO", "KeyP", "BracketLeft", "BracketRight"]];
  var KL = [["1", "2", "3", "4", "Q", "W", "E", "R", "T", "Y"], ["7", "8", "9", "0", "U", "I", "O", "P", "[", "]"]];
  var btn = [[], []];

  function hasC(s) { return mod === 2 || s === 1; }
  function maxM() { return mod === 1 ? 10 : 3; }
  function maxL() { return mod === 1 ? 20 : 8; }
  function cw(s) { return 22 + Math.min(S[s].lv, 12) * 2; }
  function chh(s) { return 30 + Math.min(S[s].lv, 12) * 3; }
  function mhp(s) { return 200 + S[s].lv * 170; }
  function front(s) { return s === 0 ? S[0].cx + cw(0) / 2 : S[1].cx - cw(1) / 2; }
  function mkS(cx) { return { cx: cx, g: 80, lv: 0, hp: 200, mines: 1, ml: 0, rg: 0, cr: 0, cs: 0, ch: 0, it: 0, tc: 30, cf: 0 }; }
  function sc(n) { return (1 + .08 * ((n - 1) % 200)) * (1 + 1.5 * Math.floor((n - 1) / 200)); }
  function puan() { return mod === 1 ? Math.max(0, (wv - 1)) * 50 + kills : 0; }
  function yaz() { var p = puan(); if (p !== sonPuan) { sonPuan = p; document.getElementById("puan").textContent = p; } }

  function yeni(m) {
    mod = m; WW = m === 1 ? 1000 : 320; VW = m === 1 ? 280 : 320; C.width = VW;
    S = [mkS(m === 1 ? 0 : 70), mkS(m === 1 ? 800 : 250)];
    U = []; P = []; F = []; wv = 0; kills = 0; sars = 0; over = 0; wq = []; wt = 150; wsp = 0; wi = 40; wf = 0; sonPuan = -1;
    cam = m === 1 ? WW - VW : 0; calis = true; mesaj = m === 1 ? "SAVUN!" : "SAVAŞ BAŞLASIN!"; msayac = 90;
    document.getElementById("bitti").hidden = true; yaz();
    kurPanel();
  }
  function yapU(s, k, m, bi) {
    var en = mod === 1 && s === 0, t = en ? EK[k] : UK[k], dm = en ? 1 + (m - 1) * .6 : m;
    var u = { id: ++idc, s: s, k: k, x: 0, hp: t.hp * m, mhp: t.hp * m, d: t.d * dm, r: t.r, cd: 0, cdm: t.cd, sp: t.sp, ok: t.ok || 0, fl: 0, at: 0, w: 0, ly: (idc % 3) * 2, boss: 0, fly: t.fly || 0, g: en ? Math.ceil(t.g * (1 + wv * .05)) : Math.round(t.c * .5), dead: 0, bi: 0 };
    if (bi !== undefined) {
      u.boss = 1; u.bi = bi; u.hp = u.mhp = 500 * m * (1 + .4 * bi); u.d = 18 * dm; u.r = 15; u.cdm = 60; u.sp = .17; u.g = Math.ceil(150 * (1 + wv * .05)); u.ok = 0; u.fly = 0; u.k = 4;
    }
    u.x = s === 0 ? (mod === 1 ? 40 + Px.rastgele(0, 12) : front(0) + 4) : front(1) - 4;
    U.push(u); return u;
  }
  function say(s) { var n = 0; U.forEach(function (u) { if (u.s === s && !u.dead) n++; }); return n; }

  // ---- maliyetler ve eylemler ----
  function maliyet(s, id) {
    var z = S[s];
    if (id < 4) return UK[id].c;
    if (id === 4) return Math.round(60 * Math.pow(mod === 1 ? 1.5 : 1.6, z.mines - 1));
    if (id === 5) return Math.round(80 * Math.pow(1.5, z.ml));
    if (id === 6) return Math.round(100 * Math.pow(1.45, z.lv));
    return [0, 0, 0, 0, 0, 0, 0, 60, 120, 80][id];
  }
  function kul(s, id) {
    var z = S[s], c = maliyet(s, id);
    if (id < 4) return z.g >= c && say(s) < (mod === 1 ? 40 : 25);
    if (id === 4) return z.mines < maxM() && z.g >= c;
    if (id === 5) return z.ml < 9 && z.g >= c;
    if (id === 6) return z.lv < maxL() && z.g >= c;
    if (id === 7) return z.cr <= 0 && z.g >= c;
    if (id === 8) return z.cs <= 0 && z.g >= c;
    return z.ch <= 0 && z.g >= c && z.hp < mhp(s);
  }
  function act(s, id) {
    if (!calis || over) return;
    var z = S[s];
    if (!kul(s, id)) { Px.ses("hata"); return; }
    z.g -= maliyet(s, id);
    if (id < 4) { var u = yapU(s, id, 1 + .1 * z.lv); Px.ses("tik"); }
    else if (id === 4) { z.mines++; Px.ses("kaz"); }
    else if (id === 5) { z.ml++; Px.ses("para"); }
    else if (id === 6) { z.lv++; z.hp += 170; Px.ses("birles"); sars = 6; for (var i = 0; i < 16; i++) F.push({ x: front(s) + Px.rastgele(-20, 20) * (s ? -1 : 1), y: GY - Px.rastgele(0, 40), vx: Px.rastgele(-1, 1), vy: Px.rastgele(-1.5, 0), l: 30, c: "#ffcd75" }); }
    else if (id === 7) { z.rg = 480; z.cr = 1500; Px.ses("boss"); mesaj = "ÖFKE!"; msayac = 60; }
    else if (id === 8) { z.cs = 2100; Px.ses("patlama"); sars = 10; var d = 40 + z.lv * 25; U.forEach(function (o) { if (o.s !== s && !o.dead) { vur(o, d, s); for (var j = 0; j < 4; j++) F.push({ x: o.x + Px.rastgele(-4, 4), y: GY - 40 - j * 12, vx: 0, vy: 3, l: 14, c: "#ffcd75" }); } }); }
    else if (id === 9) { z.ch = 1500; z.hp = Math.min(mhp(s), z.hp + mhp(s) * .3); Px.ses("al"); }
    paneliGuncelle(true);
  }

  // ---- hasar ----
  function vur(tg, d, src) {
    if (tg === "c") return;
    tg.hp -= d; tg.fl = 5;
    if (tg.boss) { sars = Math.max(sars, 3); if (tik % 3 === 0) Px.ses("vur"); for (var i = 0; i < 3; i++) F.push({ x: tg.x + Px.rastgele(-6, 6), y: GY - Px.rastgele(8, 30), vx: Px.rastgele(-1.5, 1.5), vy: Px.rastgele(-2, 0), l: 18, c: ["#fff", "#ffcd75", "#ef7d57"][i] }); }
    else F.push({ x: tg.x, y: GY - 10, vx: Px.rastgele(-1, 1), vy: -1, l: 10, c: "#fff" });
    if (tg.hp <= 0 && !tg.dead) {
      tg.dead = 1; if (tg.boss) { Px.ses("patlama"); sars = 14; mesaj = "BOSS YENİLDİ!"; msayac = 100; for (i = 0; i < 40; i++) F.push({ x: tg.x + Px.rastgele(-10, 10), y: GY - Px.rastgele(0, 40), vx: Px.rastgele(-2.5, 2.5), vy: Px.rastgele(-3, 0), l: 40, c: BP[tg.bi % 8][i % 3] }); }
      else { Px.ses("patla"); for (i = 0; i < 8; i++) F.push({ x: tg.x, y: GY - 8, vx: Px.rastgele(-1.5, 1.5), vy: Px.rastgele(-2, 0), l: 22, c: i % 2 ? "#ffcd75" : "#94a0b8" }); }
      S[src].g += tg.g; if (mod === 1 && tg.s === 0) { kills++; yaz(); }
      for (i = 0; i < 4; i++) F.push({ x: tg.x, y: GY - 12, vx: Px.rastgele(-1, 1), vy: Px.rastgele(-2.5, -1), l: 28, c: "#ffcd75" });
    }
  }
  function kaleVur(s, d) { var z = S[s]; z.hp -= d; z.cf = 5; if (Math.random() < .2) Px.ses("vur"); for (var i = 0; i < 2; i++) F.push({ x: front(s), y: GY - Px.rastgele(4, chh(s)), vx: Px.rastgele(-1, 1), vy: Px.rastgele(-1.5, 0), l: 16, c: "#94a0b8" }); }

  // ---- birim yapay zekâ ----
  function adim(u) {
    var dr = u.s === 0 ? 1 : -1, en = 1 - u.s, z = S[u.s], best = null, bd = 1e9, i, o;
    if (u.fl > 0) u.fl--; if (u.at > 0) u.at--; if (u.cd > 0) u.cd -= (z.rg > 0 && !(mod === 1 && u.s === 0) ? 1.5 : 1);
    for (i = 0; i < U.length; i++) { o = U[i]; if (o.s === en && !o.dead) { var dd = (o.x - u.x) * dr; if (dd > -4 && dd < bd) { bd = dd; best = o; } } }
    var cd = hasC(en) ? (front(en) - u.x) * dr : 1e9, tg = null, td = 1e9;
    if (best && bd <= cd) { tg = best; td = bd; } else if (hasC(en)) { tg = "c"; td = cd; }
    var rage = z.rg > 0 && !(mod === 1 && u.s === 0), dmg = u.d * (rage ? 1.6 : 1);
    if (tg && td <= u.r) {
      if (u.cd <= 0) {
        u.cd = u.cdm; u.at = 8;
        if (u.ok) { P.push({ x: u.x + dr * 4, y: GY - 12 + (u.fly ? -10 : 0), vx: dr * (u.ok === 2 ? 2 : 2.6), s: u.s, d: dmg, k: u.ok, l: 120 }); Px.ses(u.ok === 2 ? "ok" : "ok"); }
        else if (tg === "c") { kaleVur(en, dmg); } else { vur(tg, dmg, u.s); Px.ses("kilic"); }
      }
      return;
    }
    var hareket = 0;
    if (mod === 1 && u.s === 1) {
      var rally = front(1) - 70 - (u.id % 5) * 7;
      if (best && bd < 170) hareket = dr; else if (Math.abs(u.x - rally) > 3) hareket = u.x < rally ? 1 : -1;
    } else hareket = dr;
    if (hareket) {
      for (i = 0; i < U.length; i++) { o = U[i]; if (o !== u && !o.dead && o.s === u.s && (o.x - u.x) * hareket > 0 && (o.x - u.x) * hareket < 5) return; }
      u.x += hareket * u.sp * (rage ? 1.3 : 1); u.w++;
    }
  }
  function mermiler() {
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i], en = 1 - p.s, dr = p.vx > 0 ? 1 : -1, bit = false;
      p.x += p.vx; p.l--;
      if (p.l <= 0 || p.x < -10 || p.x > WW + 10) bit = true;
      if (!bit) for (var j = 0; j < U.length; j++) {
        var o = U[j];
        if (o.s === en && !o.dead && Math.abs(o.x - p.x) < 5) {
          if (p.k === 2) { U.forEach(function (q) { if (q.s === en && !q.dead && Math.abs(q.x - p.x) < 16) vur(q, p.d, p.s); }); for (var m = 0; m < 8; m++) F.push({ x: p.x, y: p.y, vx: Px.rastgele(-1.5, 1.5), vy: Px.rastgele(-1.5, 1.5), l: 14, c: ["#b55ee0", "#73eff7"][m % 2] }); }
          else vur(o, p.d, p.s);
          bit = true; break;
        }
      }
      if (!bit && hasC(en) && (front(en) - p.x) * dr <= 0) { kaleVur(en, p.d); bit = true; }
      if (bit) P.splice(i, 1);
    }
  }
  function kuleler() {
    [0, 1].forEach(function (s) {
      if (!hasC(s)) return; var z = S[s], dr = s === 0 ? 1 : -1;
      if (--z.tc > 0) return; z.tc = Math.max(20, 55 - z.lv * 2);
      var near = null, nd = 120;
      U.forEach(function (u) { if (u.s !== s && !u.dead) { var d = (u.x - front(s)) * dr; if (d > -6 && d < nd) { nd = d; near = u; } } });
      if (near) P.push({ x: front(s), y: GY - chh(s) + 4, vx: dr * 2.8, s: s, d: 4 + z.lv * 2.5, k: 1, l: 90 });
    });
  }
  function dalgaBaslat() {
    wv++; var n = wv, q = [], boss = n % 10 === 0, mx = Math.min(5, Math.floor(((n - 1) % 200) / 4)), cnt = Math.min(40, 4 + Math.floor(n * 1.4));
    if (boss) { q.push({ b: Math.floor(n / 10) - 1 }); cnt = Math.min(cnt, 10) + 3; }
    for (var i = 0; i < cnt; i++) { var k = Math.floor(Math.pow(Math.random(), 1.4) * (mx + 1)); q.push({ k: Math.min(k, mx) }); }
    wq = q; wi = Math.max(16, 70 - n); wsp = 0; wf = 0; wt = 300;
    mesaj = boss ? "BOSS DALGASI " + n : "DALGA " + n; msayac = 110; if (boss) Px.ses("boss"); else Px.ses("don");
    S[1].hp = Math.min(mhp(1), S[1].hp + mhp(1) * .04); yaz();
  }
  function dalgaGuncelle() {
    if (wq.length) {
      if (--wsp <= 0) {
        var e = wq.shift(), m = sc(wv), u = e.b !== undefined ? yapU(0, 0, m, e.b) : yapU(0, e.k, m);
        wsp = wi; for (var i = 0; i < 6; i++) F.push({ x: u.x, y: GY - 6, vx: Px.rastgele(-1, 1), vy: Px.rastgele(-1, 0), l: 20, c: "#333c57" });
        if (u.boss) { mesaj = BN[u.bi % 8] + (u.bi >= 8 ? " x" + (Math.floor(u.bi / 8) + 1) : ""); msayac = 120; }
      }
    } else {
      wf++;
      if (say(0) === 0) { if (--wt <= 0) dalgaBaslat(); } else if (wf > 1800) dalgaBaslat();
    }
  }
  function bitirKontrol() {
    if (over) return;
    var k = S[1].hp <= 0 ? 1 : (mod === 2 && S[0].hp <= 0 ? 0 : -1);
    if (k < 0) return;
    over = 100; var cx = S[k].cx; Px.ses("patlama"); sars = 20;
    for (var i = 0; i < 60; i++) F.push({ x: cx + Px.rastgele(-20, 20), y: GY - Px.rastgele(0, 50), vx: Px.rastgele(-3, 3), vy: Px.rastgele(-4, 0), l: 50, c: ["#ef7d57", "#ffcd75", "#94a0b8", "#fff"][i % 4] });
    over = 100; S[k].dead = 1;
  }
  function bitir() {
    calis = false;
    if (mod === 1) { Skor.oyunBitti("bilgi-kalesi", puan()); }
    else Px.sonuc2((S[0].hp <= 0 ? "Mavi" : "Kırmızı") + " kale kazandı!");
  }
  function guncelle() {
    tik++; if (sars > 0) sars--; if (msayac > 0) msayac--;
    for (var i = F.length - 1; i >= 0; i--) { var f = F[i]; f.x += f.vx; f.y += f.vy; f.vy += .05; if (--f.l <= 0) F.splice(i, 1); }
    if (!calis) return;
    if (over) { if (--over <= 0) bitir(); return; }
    // kamera
    if (mod === 1) { var cd = (Px.k.ArrowLeft || Px.k.KeyA ? -1 : 0) + (Px.k.ArrowRight || Px.k.KeyD ? 1 : 0); cam = Px.sinir(cam + cd * 4, 0, WW - VW); }
    // tuşlar
    [0, 1].forEach(function (s) {
      if (mod === 1 && s === 0) return;
      var ks = KS[mod === 1 ? 0 : s]; for (var j = 0; j < 10; j++) if (Px.p[ks[j]]) act(s, j);
    });
    // ekonomi
    [0, 1].forEach(function (s) {
      if (!hasC(s)) return; var z = S[s];
      if (z.rg > 0) z.rg--; if (z.cr > 0) z.cr--; if (z.cs > 0) z.cs--; if (z.ch > 0) z.ch--; if (z.cf > 0) z.cf--;
      if (++z.it >= 90) { z.it = 0; z.g += z.mines * (2 + z.ml) + 1; for (var m = 0; m < z.mines; m++) F.push({ x: mineX(s, m), y: GY - 14, vx: 0, vy: -.7, l: 26, c: "#ffcd75" }); }
    });
    if (mod === 1) dalgaGuncelle();
    U.forEach(adim); mermiler(); kuleler();
    U = U.filter(function (u) { return !u.dead; });
    bitirKontrol(); if (tik % 8 === 0) paneliGuncelle();
  }

  // ---- çizim ----
  var BX = 0, BY = 0, FC = 1, FLS = false;
  function R(dx, dy, w, h, c) { x.fillStyle = FLS ? "#fff" : c; x.fillRect(FC > 0 ? BX + dx : BX - dx - w, BY + dy, w, h); }
  function mineX(s, i) { var z = S[s]; return s === 1 ? z.cx + cw(1) / 2 + 9 + i * 14 : z.cx - cw(0) / 2 - 9 - i * 14; }
  function cizAsker(u) {
    var side = mod === 2 && u.s === 0 ? ["#e0344f", "#b13e53"] : ["#3b5dc9", "#29366f"], c = side[0], dk = side[1], ph = (u.w >> 3) & 1, a = u.at > 0 ? 3 : 0, k = u.k;
    R(-3 + ph, -5, 2, 5, "#0d0e1a"); R(1 - ph, -5, 2, 5, "#0d0e1a");
    R(-3, -11, 6, 6, k === 3 ? "#5d275d" : c); R(-3, -7, 6, 1, k === 3 ? "#3b1a3b" : dk);
    if (k === 3) R(-3, -5, 6, 3, "#5d275d");
    R(-2, -16, 5, 5, "#ffcd75"); R(1, -14, 1, 1, "#0d0e1a");
    if (k === 3) { R(-3, -17, 7, 2, "#5d275d"); R(-1, -20, 3, 3, "#5d275d"); }
    else { R(-3, -17, 7, 2, "#94a0b8"); R(-3, -15, 1, 2, "#94a0b8"); }
    if (k === 0) { R(4 + a, -12, 1, 8, "#dfe9f5"); R(3 + a, -8, 3, 1, "#ffcd75"); R(-5, -11, 2, 6, "#ffcd75"); }
    else if (k === 1) { R(2 + a, -9, 13, 1, "#a47040"); R(15 + a, -10, 3, 3, "#dfe9f5"); R(-5, -11, 2, 5, dk); }
    else if (k === 2) { R(4, -14, 1, 10, "#a47040"); R(3, -14, 2, 1, "#a47040"); R(3, -5, 2, 1, "#a47040"); R(3 - (a ? 1 : 0), -13, 1, 8, "#fff"); R(-5, -13, 2, 6, "#7a3a1a"); }
